:root{
  /* ชื่อตัวแปรคงเดิมทั้งหมด เปลี่ยนแค่ค่า — ทั้งฟอร์มจึงเปลี่ยนธีมพร้อมกันโดยไม่ต้องไล่แก้ทีละกฎ */
  /* โทนตาม CI (แดง–ทอง–ขาว) แต่ลดความแรงของแดงลง:
     แดงถูกลดความอิ่มสีและใช้เป็นสีเน้นเฉพาะปุ่ม/ป้าย ไม่ใช่พื้นที่ใหญ่
     พื้นหลังเปลี่ยนเป็นครีมอุ่นแทนขาวจัด ทองรับหน้าที่ "ความสำเร็จ" ตามดาวใน CI */
  /* ค่าที่ดูดจากแบนเนอร์ CI โดยตรง:
       แดงสด #E83323 (hue 5°) · แดงเข้ม #941F13 (hue 6°) · ทอง #F3BF42 (hue 42°) · ขาว #FBFBFB
     แดงสดตัวจริงขาวทับได้แค่ 4.26:1 ไม่ผ่าน AA จึงเข้มลงเป็น #D42B1D (5.04:1) โดยคง hue 5° เท่าเดิม
     ส่วนแดงเข้มกับทองใช้ค่า CI ตรง ๆ ได้เลย */

  --ink:#22201F;--muted:#6B645F;--hint:#8D847E;--line:#F2E9E5;--line2:#E4D8D2;
  --bg:#FCF7F5;--surface:#fff;--ok:#1F7A50;--ok-tint:#E7F5EE;--warn:#96430C;
  /* --acc = ทองสด CI ใช้ทาพื้น/ตกแต่งเท่านั้น ห้ามมีตัวหนังสือทับ (ขาวทับได้แค่ 1.70:1)
     --acc-ink = แดงเข้ม CI สำหรับปลายไล่สีและตัวหนังสือที่ต้องมีขาวทับ */
  --acc:#F3BF42;--acc2:#F8EC59;--acc-ink:#941F13;--acc3:#941F13;
  --r:20px;--rs:14px}

.bname{font-weight:600;font-size:15px}.bname span{color:var(--red)}
.prog-wrap{margin-bottom:18px}
.prog{height:7px;background:var(--line);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--red);border-radius:99px;transition:width .45s cubic-bezier(.4,0,.2,1)}
.prog-meta{display:flex;justify-content:space-between;margin-top:7px;font-size:12px;color:var(--hint)}
.prog-meta .sec{color:var(--red);font-weight:600}
/* เลย์เอาต์สองคอลัมน์ถูกยุบแล้ว — ฟอร์มกินพื้นที่ทั้งหน้า */
.sitem{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer}
.sitem:last-child{border-bottom:none}
.sitem .k{font-size:12px;color:var(--muted)}
.sitem .v{font-size:12.5px;color:var(--ink);font-weight:500;text-align:right;max-width:150px}
.sitem .v .edit{color:var(--red);font-size:11px;margin-left:5px}
.sempty{font-size:12.5px;color:var(--hint);padding:6px 0 14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:34px 38px 28px;box-shadow:0 2px 14px rgba(38,33,30,.05);
  animation:slide .3s cubic-bezier(.2,.7,.2,1);
  flex:1 1 auto;width:100%;display:flex;flex-direction:column}
.card>*{max-width:820px;width:100%;margin-left:auto;margin-right:auto}
.card .wel{max-width:900px}
@keyframes slide{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.qnum{font-size:12.5px;color:var(--red);font-weight:600;margin-bottom:8px}
.qh{font-size:23px;font-weight:700;margin:0 0 6px;line-height:1.3}
.qsub{font-size:14px;color:var(--muted);margin:0 0 22px}
.opts{display:grid;gap:12px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{display:flex;align-items:center;gap:14px;text-align:left;width:100%;background:var(--surface);border:1.5px solid var(--line2);border-radius:var(--rs);padding:16px 18px;cursor:pointer;font-family:inherit;font-size:15px;color:var(--ink);transition:all .15s}
.opt:hover{border-color:var(--red);background:var(--red-tint)}
.opt.on{border-color:var(--red);background:var(--red-tint);box-shadow:0 0 0 3px var(--red-tint)}
.opt .ic{width:42px;height:42px;border-radius:10px;background:var(--red-tint);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.opt .ic svg{width:22px;height:22px;stroke:var(--red);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.opt .tx b{display:block;font-weight:600;font-size:15px}
.opt .tx span{font-size:12.5px;color:var(--muted)}
.opt .chk{margin-left:auto;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line2);flex:0 0 auto;display:flex;align-items:center;justify-content:center}
.opt.on .chk{background:var(--red);border-color:var(--red)}
.opt.on .chk::after{content:"\2713";color:#fff;font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{font-family:inherit;font-size:14px;padding:10px 18px;border-radius:99px;border:1.5px solid var(--line2);background:#fff;color:var(--muted);cursor:pointer;transition:all .13s}
.chip:hover{border-color:var(--red)}
.chip.on{background:var(--red-tint);color:var(--red-dark);border-color:var(--red);font-weight:600}
.fieldrow{margin-bottom:14px}
.fieldrow label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:500}
.fieldrow label .req{color:var(--red)}
.fieldrow label .opt2{color:var(--hint);font-weight:400}
input,select{font-family:inherit;font-size:15px;color:var(--ink);width:100%;padding:13px 14px;border:1.5px solid var(--line2);border-radius:var(--rs);background:#fff;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus{border-color:var(--red);box-shadow:0 0 0 3px var(--red-tint)}
input.err,select.err{border-color:var(--red);background:var(--red-tint)}
input[type=file]{padding:11px 14px;font-size:13.5px;color:var(--muted);cursor:pointer}
input[type=file]::file-selector-button{font-family:inherit;font-size:13px;margin-right:10px;padding:8px 14px;border:1px solid var(--line2);border-radius:8px;background:#fff;color:var(--ink);cursor:pointer}
.agehint{display:block;font-size:12.5px;color:var(--red);margin-top:6px}
/* ---- accordion ช่องทางรับงาน ---- */
.plist{display:grid;gap:10px}
.pl{border:1.5px solid var(--line2);border-radius:var(--rs);background:#fff;overflow:hidden;transition:border-color .15s,box-shadow .15s}
.pl:hover{border-color:var(--line2)}
.pl.on{border-color:var(--red);box-shadow:0 0 0 3px var(--red-tint)}
.pl.on.fll{border-color:var(--ok);box-shadow:0 0 0 3px var(--ok-tint)}
.pl-h{display:flex;align-items:center;gap:13px;padding:14px 16px;cursor:pointer;user-select:none}
.pl-h:hover{background:var(--bg)}
.pl.on .pl-h:hover{background:transparent}
.pl-h .pic{width:38px;height:38px;border-radius:10px;background:var(--bg);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.pl-h .pic svg{width:22px;height:22px}
.pl-h .pic .plogo{width:38px;height:38px;border-radius:10px;display:block}
.pl-h .pic:has(.plogo){background:transparent}
.pl-h .pn{flex:1 1 auto;font-weight:600;font-size:15px;line-height:1.35;min-width:0}
.pl-h .ps{display:block;font-size:12.5px;color:var(--hint);font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl.fll .pl-h .ps{color:var(--ok);font-weight:500}
.pl-h .cv{display:flex;flex:0 0 auto;transition:transform .25s}
.pl-h .cv svg{width:18px;height:18px;stroke:var(--hint);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pl.on .pl-h .cv{transform:rotate(180deg)}
.pl-h .chk{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line2);flex:0 0 auto;display:flex;align-items:center;justify-content:center}
.pl.on .pl-h .chk{background:var(--red);border-color:var(--red)}
.pl.on.fll .pl-h .chk{background:var(--ok);border-color:var(--ok)}
.pl.on .pl-h .chk::after{content:"\2713";color:#fff;font-size:13px}
.pl-b{display:none;padding:2px 16px 16px;border-top:1px solid var(--line);margin-top:0}
.pl.on .pl-b{display:block;padding-top:14px;animation:drop .22s ease}
@keyframes cardin{from{opacity:.35}to{opacity:1}}
@keyframes drop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.fol{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--hint);background:var(--bg);border-radius:99px;padding:6px 12px;margin:-6px 0 14px}
.fol.load{color:var(--muted)}
.fol.ok{background:var(--ok-tint);color:var(--ok);font-weight:500}
.fol i{width:6px;height:6px;border-radius:50%;background:currentColor;flex:0 0 auto}
.rwrap{position:relative}
.rwrap .cur{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:15px;pointer-events:none}
.rwrap input{padding-left:30px;font-weight:600}
.reco{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-top:9px}
.reco .rl{font-size:12.5px;color:var(--hint)}
.rbtn{font-family:inherit;font-size:12.5px;font-weight:600;color:var(--red-dark);background:var(--red-tint);border:1px solid var(--red-tint2);border-radius:99px;padding:5px 12px;cursor:pointer;transition:all .13s}
.rbtn:hover{background:var(--red);border-color:var(--red);color:#fff}
.rbtn.used{background:var(--bg);border-color:var(--line2);color:var(--hint);cursor:default}
.rbtn.used:hover{background:var(--bg);color:var(--hint)}
.rng{font-size:12px;color:var(--hint)}
/* ---- แถบพรีวิว ---- */
.pvbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;background:#16181D;color:#fff;border-radius:var(--rs);padding:9px 12px;margin-bottom:14px}
.pvtag{font-size:11px;font-weight:700;letter-spacing:.5px;background:var(--red);color:#fff;border-radius:99px;padding:3px 10px}
.pvbar select{font-family:inherit;font-size:12.5px;padding:7px 10px;border-radius:8px;border:none;background:#2A2D34;color:#fff;width:auto;flex:1 1 190px;min-width:0}
.pvbar select:focus{box-shadow:none;border:none}
.pvb{font-family:inherit;font-size:12.5px;font-weight:600;background:#2A2D34;color:#fff;border:none;border-radius:8px;padding:7px 12px;cursor:pointer}
.pvb:hover{background:#3A3E46}
.pvsw{display:flex;align-items:center;gap:6px;font-size:12px;color:#B9BCC2;cursor:pointer;white-space:nowrap}
.pvsw input{width:auto;transform:scale(1.1);accent-color:var(--red)}
/* ---- ยอดผู้ติดตาม / การยืนยัน ---- */
.fgrid{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.fgrid .fieldrow{flex:1 1 160px;margin-bottom:0}
.cbtn{font-family:inherit;font-size:13px;font-weight:600;white-space:nowrap;background:#fff;color:var(--ink);border:1.5px solid var(--line2);border-radius:var(--rs);padding:12px 15px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:all .15s}
.cbtn:hover{border-color:var(--red);color:var(--red)}
.cbtn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.cbtn.done{background:var(--ok-tint);border-color:#BFE0CC;color:var(--ok);cursor:default}
.vfy{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;border-radius:99px;padding:5px 11px;margin-top:10px;font-weight:500}
.vfy.self{background:#FFF7E6;color:var(--warn)}
.vfy.ok{background:var(--ok-tint);color:var(--ok)}
.vfy.wait{background:var(--bg);color:var(--hint)}
.vfy svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.tech{margin-top:16px;border:1px solid var(--line);border-radius:var(--rs);background:var(--bg)}
.tech summary{cursor:pointer;font-size:12.5px;font-weight:600;color:var(--muted);padding:11px 14px;list-style:none}
.tech summary::-webkit-details-marker{display:none}
.tech summary::before{content:"\25B8 ";color:var(--red)}
.tech[open] summary::before{content:"\25BE "}
.tech .tb{padding:0 14px 12px;font-size:12px;color:var(--muted);line-height:1.65}
.tech .tb b{color:var(--ink)}
.tech .tb div{padding:5px 0;border-top:1px solid var(--line)}
/* ---- หน้ารวมหลายคำถาม ---- */
.gsec{border-top:1px solid var(--line);margin-top:24px;padding-top:20px}
.gsec.first{border-top:none;margin-top:6px;padding-top:0}
.gsec h3{font-size:15.5px;font-weight:600;margin:0 0 3px;letter-spacing:-.2px}
.gsec .gs{font-size:12.5px;color:var(--hint);margin-bottom:12px;line-height:1.5}
.gsec .gs.n{margin-bottom:12px}
.optwrap{display:flex;flex-direction:column}
/* การ์ดที่กางแล้ว = กรอบเดียวต่อเนื่อง */
.optwrap.open{border:1.5px solid var(--red);border-radius:var(--rs);box-shadow:0 0 0 3px var(--red-tint);background:var(--surface);overflow:hidden;transition:box-shadow .15s}
.optwrap.open>.opt.on{border:none;border-radius:0;box-shadow:none;background:var(--red-tint);width:100%}
.nest{padding:16px 18px 18px;background:var(--surface);animation:drop .22s ease;position:relative}
.nest::before{content:"";position:absolute;left:18px;right:18px;top:0;height:1px;background:repeating-linear-gradient(90deg,var(--red-tint2) 0 5px,transparent 5px 10px)}
.nest .nh{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--red-dark);margin-bottom:11px}
.nest .nh::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--red);flex:0 0 auto}
.nest .nh .req2{margin-left:auto;font-size:11px;font-weight:500;color:var(--hint)}
.nest .chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:0}
.nest .chip{font-size:13px;padding:8px 15px;border-color:var(--line);background:var(--bg);color:var(--muted)}
.nest .chip:hover{border-color:var(--red);background:var(--surface);color:var(--red-dark)}
.nest .chip.on{background:var(--red);border-color:var(--red);color:#fff;font-weight:600;box-shadow:0 2px 8px rgba(228,0,43,.22)}
.nest .nfields{margin-top:2px}
.nest .nlabel{margin-top:16px}
@media(max-width:640px){.nest{padding:14px 15px 16px}.nest .chip{font-size:12.5px;padding:8px 13px}}
.gerr{display:none;font-size:12.5px;color:var(--red);margin-top:8px}
.gerr.show{display:block}
.nfields{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:13px}
.nfields .fieldrow{margin-bottom:0}
.nfields .fieldrow.full{grid-column:1 / -1}
.nlabel{font-size:12.5px;font-weight:600;color:var(--red-dark);margin:2px 0 9px}
.docs{display:grid;gap:8px}
.doc{display:flex;align-items:center;gap:11px;background:#fff;border:1.5px dashed var(--line2);border-radius:10px;padding:11px 13px;cursor:pointer;transition:border-color .15s}
.doc:hover{border-color:var(--red)}
.doc.on{border-style:solid;border-color:var(--ok);background:var(--ok-tint)}
.doc.err{border-color:var(--red);border-style:solid}
.doc input[type=file]{display:none}
.doc .di{width:30px;height:30px;border-radius:8px;background:var(--bg);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.doc.on .di{background:#fff}
.doc .di svg{width:15px;height:15px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.doc.on .di svg{stroke:var(--ok)}
.doc .dt{flex:1;min-width:0;font-size:13px;font-weight:600;line-height:1.35}
.doc .dt em{display:block;font-style:normal;font-size:11px;color:var(--hint);font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.doc.on .dt em{color:var(--ok)}
.doc .db{font-size:12px;font-weight:600;color:var(--red);white-space:nowrap;flex:0 0 auto}
.doc.on .db{color:var(--ok)}
.paynote{display:flex;gap:8px;align-items:flex-start;font-size:11.5px;color:var(--muted);line-height:1.55;margin-top:12px}
.paynote svg{width:14px;height:14px;stroke:var(--red);fill:none;stroke-width:2;flex:0 0 auto;margin-top:2px}
@media(max-width:640px){.nfields{grid-template-columns:1fr}}
/* ---- หน้าโปรไฟล์สรุป ---- */
.pfhero{display:flex;align-items:center;gap:15px;padding:19px 18px;border-radius:16px;background:linear-gradient(135deg,#16181D 0%,#2C2F38 100%);color:#fff;margin-bottom:12px;position:relative;overflow:hidden}
.pfhero::after{content:"";position:absolute;right:-42px;top:-42px;width:170px;height:170px;border-radius:50%;background:rgba(228,0,43,.28)}
.pfhero .av{width:62px;height:62px;border-radius:50%;background:linear-gradient(135deg,var(--red),#FF5A78);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;flex:0 0 auto;letter-spacing:-.5px;z-index:1;border:2.5px solid rgba(255,255,255,.18)}
.pfhero .hi{flex:1;min-width:0;z-index:1}
.pfhero h2{font-size:20px;font-weight:700;margin:0 0 3px;letter-spacing:-.4px}
.pfhero .hsub{font-size:12.5px;color:rgba(255,255,255,.62);margin-bottom:9px}
.pfhero .tags{display:flex;flex-wrap:wrap;gap:6px}
.pfhero .tg{font-size:11.5px;background:rgba(255,255,255,.13);border-radius:99px;padding:4px 10px;white-space:nowrap}
.pfhero .tg.red{background:var(--red);font-weight:600}
.pstats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.pstats div{background:var(--bg);border-radius:12px;padding:12px 10px;text-align:center}
.pstats b{display:block;font-size:17px;font-weight:700;letter-spacing:-.4px;line-height:1.25}
.pstats span{font-size:11px;color:var(--hint)}
.galh{display:flex;align-items:center;gap:9px;font-size:13.5px;font-weight:600;margin:0 0 10px}
.galh .pic{width:26px;height:26px;border-radius:7px;background:var(--bg);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.galh .pic svg{width:16px;height:16px}
.galh .pic .plogo{width:26px;height:26px;border-radius:7px;display:block}
.galh small{margin-left:auto;font-weight:400;color:var(--hint);font-size:11.5px}
.gal{margin-bottom:16px}
.gal:last-child{margin-bottom:0}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.tile{border:1px solid var(--line);border-radius:11px;overflow:hidden;background:#fff}
.tile .th{position:relative;aspect-ratio:4/5;background:linear-gradient(150deg,var(--g1),var(--g2));display:flex;align-items:center;justify-content:center}
.tile .th .emo{font-size:34px;filter:drop-shadow(0 3px 6px rgba(0,0,0,.16))}
.tile .th .pb2{position:absolute;left:7px;top:7px;width:20px;height:20px;border-radius:6px;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center}
.tile .th .pb2 svg{width:12px;height:12px}
.tile .th .pb2 .plogo{width:20px;height:20px;border-radius:6px;display:block}
.tile .th .dur{position:absolute;right:7px;bottom:7px;font-size:10px;color:#fff;background:rgba(0,0,0,.5);border-radius:5px;padding:2px 6px}
.tile .tc{font-size:11.5px;line-height:1.45;padding:8px 9px 5px;font-weight:500;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:38px}
.tile .tm{font-size:10.5px;color:var(--hint);padding:0 9px 9px;display:flex;gap:9px}
.simnote{display:flex;gap:8px;align-items:flex-start;font-size:11.5px;color:var(--hint);background:var(--bg);border-radius:10px;padding:9px 12px;margin-top:11px;line-height:1.5}
.simnote svg{width:14px;height:14px;stroke:var(--red);fill:none;stroke-width:2;flex:0 0 auto;margin-top:2px}
@media(max-width:640px){
  .pstats{grid-template-columns:repeat(2,1fr)}
  .pfhero{padding:16px 15px;gap:12px}
  .pfhero .av{width:52px;height:52px;font-size:18px}
  .pfhero h2{font-size:17px}
  .grid3{grid-template-columns:repeat(2,1fr)}
}
.pf{border:1px solid var(--line);border-radius:var(--rs);overflow:hidden;margin-bottom:14px}
.pf .ph{display:flex;align-items:center;gap:8px;background:var(--bg);padding:11px 15px;cursor:pointer}
.pf .ph b{font-size:13.5px;flex:1}
.pf .ph .ed{font-size:12px;color:var(--red);font-weight:600}
.pf .pb{padding:13px 15px}
.prow{display:flex;gap:12px;padding:7px 0;font-size:13.5px;line-height:1.55;border-top:1px solid var(--line)}
.prow:first-child{border-top:none;padding-top:0}
.prow .pk{color:var(--hint);flex:0 0 116px;font-size:12.5px;padding-top:1px}
.prow .pv{flex:1;min-width:0;font-weight:500;word-break:break-word}
.prow .pv.dim{font-weight:400;color:var(--hint)}
.pchan{border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin-bottom:9px}
.pchan:last-child{margin-bottom:0}
.pchan .pct{display:flex;align-items:center;gap:9px;font-weight:600;font-size:13.5px;margin-bottom:8px}
.pchan .pct .pic{width:26px;height:26px;border-radius:7px;background:var(--bg);display:flex;align-items:center;justify-content:center}
.pchan .pct .pic svg{width:16px;height:16px}
.pchan .pct .pic .plogo{width:26px;height:26px;border-radius:7px;display:block}
.pchan .pct small{margin-left:auto;font-weight:400;color:var(--hint);font-size:11.5px}
.prate{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:4px 0;border-top:1px dashed var(--line)}
.prate span:last-child{font-weight:700;white-space:nowrap}
.pfoot{display:flex;gap:9px;align-items:flex-start;font-size:12px;color:var(--hint);line-height:1.55;margin:4px 0 16px}
.pfoot svg{width:14px;height:14px;stroke:var(--hint);fill:none;stroke-width:2;flex:0 0 auto;margin-top:2px}
.fmthead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:16px 0 8px}
.fmthead .fl1{font-size:13px;font-weight:600;color:var(--ink)}
.fmthead .fl2{font-size:11.5px;color:var(--hint);font-weight:400;display:block}
.allbtn{font-family:inherit;font-size:11.5px;font-weight:600;color:var(--red-dark);background:var(--red-tint);border:1px solid var(--red-tint2);border-radius:99px;padding:5px 11px;cursor:pointer;white-space:nowrap}
.allbtn:disabled{background:var(--bg);border-color:var(--line2);color:var(--hint);cursor:default}
.fmts{display:grid;gap:7px}
.fx{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;cursor:pointer;background:#fff}
.fx:hover{border-color:var(--line2)}
.fx.on{border-color:var(--red);background:var(--red-tint)}
.fx .cbx{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--line2);flex:0 0 auto;display:flex;align-items:center;justify-content:center;background:#fff}
.fx.on .cbx{background:var(--red);border-color:var(--red)}
.fx.on .cbx::after{content:"\2713";color:#fff;font-size:11px;line-height:1}
.fxl{flex:1 1 auto;min-width:0;font-size:13.5px;font-weight:500;line-height:1.35}
.fxl em{display:block;font-style:normal;font-size:11px;color:var(--hint);font-weight:400}
.fxr{display:flex;align-items:center;gap:3px;background:#fff;border:1.5px solid var(--line2);border-radius:8px;padding:3px 9px;flex:0 0 auto}
.fx.on .fxr{border-color:#F3B9C4}
.fxr span{font-size:12px;color:var(--muted)}
.fxr input{width:66px;border:none!important;box-shadow:none!important;padding:4px 0;margin:0;font-size:13.5px;font-weight:700;text-align:right;background:transparent;font-family:inherit}
.fxr input:focus{border:none;box-shadow:none}
.fx:not(.on) .fxr{opacity:.35;pointer-events:none}
.autonote{display:flex;gap:8px;align-items:flex-start;font-size:12px;color:var(--muted);background:var(--bg);border-radius:10px;padding:10px 13px;margin-bottom:14px;line-height:1.55}
.autonote svg{width:15px;height:15px;stroke:var(--red);fill:none;stroke-width:2;stroke-linecap:round;flex:0 0 auto;margin-top:2px}
.basis{font-size:11.5px;color:var(--hint);margin-top:7px;line-height:1.5}
.basis b{color:var(--muted);font-weight:600}
.lerr{display:none;font-size:12px;color:var(--red);margin-top:6px}
.lerr.show{display:block}
.rbtn:disabled{cursor:default}
.dev{display:none;font-size:12.5px;margin-top:8px;padding:9px 12px;border-radius:9px;line-height:1.5}
.dev.show{display:block}
.dev.lo{background:#FFF7E6;color:var(--warn)}
.dev.hi{background:var(--red-tint);color:var(--red-dark)}
.gatehint{font-size:12.5px;color:var(--hint);margin-top:14px;display:flex;gap:8px;align-items:flex-start}
.gatehint svg{width:15px;height:15px;stroke:var(--hint);fill:none;stroke-width:2;stroke-linecap:round;flex:0 0 auto;margin-top:3px}
.note{display:flex;gap:9px;background:var(--bg);border-radius:var(--rs);padding:12px 14px;font-size:12.5px;color:var(--muted);line-height:1.55;margin-top:14px}
.note svg{width:16px;height:16px;stroke:var(--red);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto;margin-top:2px}
.err-txt{display:none;font-size:12.5px;color:var(--red);margin-top:12px}
.err-txt.show{display:block}
.warn-txt{color:var(--warn)}
.legal{max-height:230px;overflow-y:auto;border:1px solid var(--line2);border-radius:var(--rs);padding:15px 17px;font-size:12.5px;color:var(--muted);line-height:1.7;margin-bottom:14px}
.legal h4{font-size:12.5px;color:var(--ink);margin:12px 0 3px}
.legal h4:first-child{margin-top:0}
.legal p{margin:0 0 6px}
.consent{display:flex;gap:11px;align-items:flex-start;background:var(--bg);border:1px solid var(--line);border-radius:var(--rs);padding:13px 15px;margin-bottom:10px;cursor:pointer;transition:all .15s}
.consent.on{background:var(--ok-tint);border-color:#BFE0CC}
.consent input{width:auto;margin-top:3px;accent-color:var(--red);transform:scale(1.2)}
.consent span{font-size:13px;color:var(--muted)}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:26px}
.btn{font-family:inherit;font-size:15px;font-weight:600;padding:13px 26px;border-radius:var(--rs);cursor:pointer;border:1.5px solid var(--line2);background:#fff;color:var(--ink);display:inline-flex;align-items:center;gap:7px;transition:all .15s}
.btn:hover{background:var(--bg)}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn.primary:hover{background:var(--red-dark)}
.btn.primary:disabled{opacity:.4;cursor:not-allowed}
.btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.link-btn{background:none;border:none;color:var(--muted);font-family:inherit;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:8px}
.link-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}
.skip{background:none;border:none;color:var(--hint);font-family:inherit;font-size:13px;cursor:pointer;text-decoration:underline;margin-top:14px}
.done{text-align:center;padding:20px 10px}
.done .big{width:72px;height:72px;border-radius:50%;background:var(--ok-tint);display:inline-flex;align-items:center;justify-content:center;margin-bottom:16px}
.done .big svg{width:36px;height:36px;stroke:var(--ok);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.done h2{font-size:22px;margin:0 0 8px}.done p{color:var(--muted);margin:0 0 18px}
.foot{text-align:center;font-size:11.5px;color:var(--hint);margin-top:18px}
@media(max-width:820px){
  .wrap{padding:14px 12px 20px}
  .card{padding:22px 18px 20px;border-radius:var(--rs)}
  .qh{font-size:21px}
}

/* ============ แถบความคืบหน้าแบบ story ============ */
.prog-wrap{margin-bottom:18px}
/* ทุกขีดสูงเท่ากันตลอด ไม่มีขีดไหนโตขึ้นตอนกด — เปลี่ยนแค่สี ตาจึงไม่สะดุด */
.pseg{display:flex;gap:5px}
.pseg i{flex:1;height:4px;border-radius:99px;background:rgba(148,31,19,.16);position:relative;overflow:hidden;
  transition:background .28s ease}
.pseg i.done{background:var(--acc)}   /* ทอง CI = ผ่านแล้ว (ดาวที่สะสมได้) */
.pseg i.now::after{content:'';position:absolute;inset:0;border-radius:99px;background:var(--red);
  transform-origin:left;animation:fillseg .5s cubic-bezier(.3,.9,.3,1) forwards}
@keyframes fillseg{from{transform:scaleX(0)}to{transform:scaleX(1)}}

/* ============ หัวข้อแบบเกม ============ */
.qhead{display:flex;align-items:center;gap:9px;margin-bottom:12px}
.qemo{width:32px;height:32px;border-radius:11px;display:flex;align-items:center;justify-content:center;
  font-size:18px;background:var(--red-tint);border:1px solid var(--red-tint2);flex:0 0 auto}
.qnum{display:inline-flex;align-items:center;background:var(--red-tint);border-radius:99px;
  padding:4px 12px;font-size:12px!important;letter-spacing:.3px;margin:0}

/* ============ หน้าต้อนรับ ============ */
.wel{text-align:center;padding:6px 0 2px}
.welbadge{display:inline-flex;align-items:center;gap:7px;background:linear-gradient(100deg,var(--red),var(--acc-ink));
  color:#fff;border-radius:99px;padding:6px 16px;font-size:12.5px;font-weight:700;letter-spacing:.6px;
  box-shadow:0 0 0 2px var(--acc) inset}   /* ขอบทอง = ดาวใน CI */
.welh{font-size:31px;font-weight:700;line-height:1.25;margin:16px 0 8px}
.welh em{font-style:normal;background:linear-gradient(100deg,var(--red),var(--acc-ink));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.welsub{font-size:15px;color:var(--muted);margin:0 auto 24px;max-width:430px}
.welgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;text-align:left;margin-bottom:20px}
.welc{display:flex;gap:12px;align-items:flex-start;background:var(--bg);border:1.5px solid var(--line);
  border-radius:var(--rs);padding:15px 16px}
.welc .e{font-size:24px;line-height:1.1;flex:0 0 auto}
.welc b{display:block;font-size:14.5px;font-weight:600;margin-bottom:2px}
.welc span{font-size:12.5px;color:var(--muted);line-height:1.5}
.welsteps{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;
  font-size:12.5px;color:var(--hint);margin-bottom:22px}
.welsteps b{background:#fff;border:1.5px solid var(--line2);border-radius:99px;padding:4px 12px;
  font-weight:600;color:var(--muted);font-size:12px}
.welsteps i{font-style:normal;color:var(--line2)}
.welbtn{font-family:inherit;font-size:17px;font-weight:700;color:#fff;border:none;cursor:pointer;
  background:linear-gradient(100deg,var(--red),var(--acc-ink));border-radius:99px;padding:16px 42px;
  box-shadow:0 8px 22px rgba(212,43,29,.28);transition:transform .16s,box-shadow .16s}
.welbtn:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(212,43,29,.36)}
.welbtn:active{transform:scale(.97)}
.weltime{font-size:12.5px;color:var(--hint);margin-top:12px}

/* ============ ป้ายภาษี / เอกสารทีหลัง ============ */
.taxbox{margin-top:14px;border:1.5px solid var(--line2);border-radius:var(--rs);overflow:hidden}
.taxbox .th{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--bg);
  font-size:13.5px;font-weight:600;border-bottom:1px solid var(--line)}
.taxbox .th .e{font-size:17px}
.taxrow{display:flex;justify-content:space-between;gap:10px;padding:8px 14px;font-size:13.5px;
  border-bottom:1px solid var(--line)}
.taxrow:last-child{border-bottom:none}
.taxrow span:first-child{color:var(--muted)}
.taxrow b{font-weight:600}
.taxrow.tot b{color:var(--ok)}
.laterbox{margin-top:12px;border:1.5px dashed var(--line2);border-radius:var(--rs);padding:13px 15px;
  background:var(--bg)}
.laterbox .lh{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;margin-bottom:7px}
.laterbox .lh .e{font-size:17px}
.laterbox ul{margin:0;padding-left:19px}
.laterbox li{font-size:12.5px;color:var(--muted);line-height:1.75}
.laterbox .lt{font-size:12.5px;color:var(--hint);margin-top:7px}

/* ============ พื้นหลังนุ่ม + การ์ดกระจกฝ้า ============ */
body{background:
  radial-gradient(760px 480px at 12% -6%, rgba(212,43,29,.13), transparent 62%),
  radial-gradient(680px 460px at 92% 4%, rgba(243,191,66,.20), transparent 60%),
  radial-gradient(620px 520px at 50% 108%, rgba(212,43,29,.09), transparent 62%),
  var(--bg);
  background-attachment:fixed}
.card{background:rgba(255,255,255,.74);backdrop-filter:blur(22px) saturate(1.25);
  -webkit-backdrop-filter:blur(22px) saturate(1.25);
  border:1px solid rgba(255,255,255,.85);
  box-shadow:0 8px 40px rgba(148,31,19,.10), 0 1px 0 rgba(255,255,255,.9) inset}

/* ============ อีโมจิ 3D ลอยหน้าต้อนรับ ============ */
.wel{position:relative}
/* อีโมจิลอยอยู่ชั้นหลังเสมอ และถูกขังไว้เฉพาะแถบหัวเรื่อง ไม่ให้ลงมาถึงแถวการ์ด */
.wel>*:not(.f3d){position:relative;z-index:2}
.f3dzone{position:absolute;top:0;left:0;right:0;height:190px;z-index:0;pointer-events:none;overflow:hidden}
.f3d{position:absolute;font-size:38px;line-height:1;pointer-events:none;user-select:none;
  filter:drop-shadow(0 8px 14px rgba(148,31,19,.22));opacity:.9}
.f3d.a{top:4px;left:14px;animation:fl 6.5s ease-in-out infinite}
.f3d.b{top:12px;right:16px;font-size:32px;animation:fl 7.5s ease-in-out .8s infinite reverse}
.f3d.c{top:104px;left:34px;font-size:28px;animation:fl 8.2s ease-in-out 1.6s infinite}
.f3d.d{top:96px;right:36px;font-size:30px;animation:fl 6.9s ease-in-out 2.4s infinite reverse}
@keyframes fl{0%,100%{transform:translateY(0) rotate(-7deg)}50%{transform:translateY(-14px) rotate(9deg)}}
/* จอแคบกว่านี้ ตัวหนังสือกินความกว้างจนไม่เหลือที่ให้อีโมจิ — ซ่อนไปเลยดีกว่าให้ทับ */
@media(max-width:1180px){.f3dzone{display:none}}

/* ============ STAR Card (หน้าสุดท้าย) ============ */
.starcard{position:relative;overflow:hidden;border-radius:22px;padding:20px 22px 18px;margin-bottom:18px;
  background:linear-gradient(135deg,var(--red) 0%,var(--red-dark) 78%);color:#fff;
  box-shadow:0 14px 38px rgba(148,31,19,.32)}
.sc-glow{position:absolute;width:280px;height:280px;right:-90px;top:-140px;border-radius:50%;
  background:radial-gradient(circle,rgba(243,191,66,.55),transparent 66%);pointer-events:none}
.sc-top{position:relative;display:flex;align-items:center;justify-content:space-between;gap:10px}
.sc-brand{font-size:11.5px;font-weight:700;letter-spacing:1.6px;opacity:.9}
.sc-rank{background:var(--acc);color:#3A1A05;border-radius:99px;padding:4px 13px;
  font-size:12px;font-weight:800;letter-spacing:1px;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.sc-mid{position:relative;display:flex;align-items:center;gap:14px;margin-top:16px}
.sc-av{width:60px;height:60px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;
  font-size:21px;font-weight:800;color:var(--red-dark);background:#fff;
  box-shadow:0 0 0 3px rgba(243,191,66,.85)}
.sc-id h2{margin:0;font-size:23px;line-height:1.2;font-weight:700}
.sc-sub{font-size:13px;opacity:.86;margin-top:3px}
.sc-tags{position:relative;display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.sc-tags .tg{background:rgba(255,255,255,.17);border:1px solid rgba(255,255,255,.26);
  border-radius:99px;padding:3px 11px;font-size:12.5px;font-weight:600}
.sc-stats{position:relative;display:flex;gap:8px;margin-top:16px;padding-top:14px;
  border-top:1px solid rgba(255,255,255,.22)}
.sc-stats>div{flex:1;text-align:center}
.sc-stats b{display:block;font-size:20px;font-weight:800;line-height:1.1}
.sc-stats span{font-size:10.5px;opacity:.8;letter-spacing:.4px}

/* ============ Magic Button ============ */
.allbtn{display:block;width:100%;margin:2px 0 12px;font-family:inherit;font-size:15px;font-weight:700;
  color:#fff;background:linear-gradient(100deg,var(--red),var(--red-dark));
  border:none;border-radius:14px;padding:13px 16px;cursor:pointer;white-space:nowrap;
  box-shadow:0 6px 18px rgba(212,43,29,.26);transition:transform .15s,box-shadow .15s}
.allbtn:hover{transform:translateY(-1px);box-shadow:0 9px 22px rgba(212,43,29,.32)}
.allbtn:active{transform:scale(.985)}
.allbtn:disabled{background:var(--bg);color:var(--hint);box-shadow:none;cursor:default;
  border:1px solid var(--line2);transform:none}

/* ============ PDPA แบบพับได้ท้ายหน้า ============ */
.legalfold{margin-top:14px;border:1px solid var(--line2);border-radius:var(--rs);background:rgba(255,255,255,.6)}
.legalfold>summary{cursor:pointer;list-style:none;padding:11px 15px;font-size:13px;font-weight:600;color:var(--muted)}
.legalfold>summary::-webkit-details-marker{display:none}
.legalfold .legal{padding:0 15px 12px;margin:0}

/* โฟกัสให้เป็นสีแบรนด์ ไม่ใช่วงน้ำเงินของเบราว์เซอร์ */
.opt:focus-visible,.chip:focus-visible,.doc:focus-visible,.plrow:focus-visible{
  outline:2px solid var(--red);outline-offset:2px}

/* ============ กล่องยินยอม PDPA ท้ายหน้า ============ */
.consentbox{margin-top:18px;border:1.5px solid var(--red-tint2);border-radius:var(--rs);
  background:rgba(255,255,255,.7);overflow:hidden}
.cbh{display:flex;gap:10px;align-items:flex-start;padding:13px 15px;background:var(--red-tint);
  border-bottom:1px solid var(--red-tint2)}
.cbh .e{font-size:18px;line-height:1.2}
.cbh b{display:block;font-size:14.5px;font-weight:700;color:var(--red-dark)}
.cbh small{font-size:12.5px;color:var(--muted)}
.cbscroll{max-height:246px;overflow-y:auto;padding:4px 15px 12px}
.cbscroll .legal{margin:0}
.cbscroll .legal h4{margin:12px 0 3px;font-size:13px}
.cbscroll .legal p{margin:0;font-size:12.5px;line-height:1.7;color:var(--muted)}

/* ============ หมายเหตุใต้บล็อกย่อย ============ */
.gnote{display:flex;gap:9px;align-items:flex-start;margin-top:11px;padding:11px 13px;
  border:1px dashed var(--line2);border-radius:var(--rs);background:rgba(255,255,255,.55);
  font-size:12.5px;line-height:1.75;color:var(--muted)}
.gnote .e{font-size:15px;line-height:1.4;flex:0 0 auto}
.gnote b{color:var(--ink);font-weight:700}
.gnote u{text-decoration-color:var(--red);text-underline-offset:2px}
</style>

  // ช่วง: 0-10K | 10K-50K | 50K-500K | 500K+  (ยิ่งฐานใหญ่ ราคาต่อพันยิ่งลด)
  var BRK=[10000,50000,500000];
  var RATE={
    ig     :{cpm:[90,60,40,25], min:500},
    tiktok :{cpm:[100,70,45,28],min:600},
    fb     :{cpm:[80,55,35,20], min:500},

  function hashn(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=(h*16777619)>>>0;}return h;}
  function fakeFol(link){return 2400+(hashn(link)%418000);} // จำลองผลลัพธ์ API ใน prototype เท่านั้น
  function fmtK(n){if(n>=1000000)return (n/1000000).toFixed(1)+'M';if(n>=1000)return (n/1000).toFixed(n>=100000?0:1)+'K';return String(n);}
  function tierName(n){return n<10000?'Nano':(n<50000?'Micro':(n<500000?'Mid-tier':'Macro'));}
  function num(n){return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,',');}
  function recoRate(pv,fol){
    if(!fol) return 0;                       // ไม่มียอดผู้ติดตาม = ยังเทียบกับคนอื่นไม่ได้
    var r=RATE[pv]||RATE.ig, left=fol, sum=0, prev=0;
    for(var i=0;i<BRK.length;i++){ var part=Math.max(0,Math.min(fol,BRK[i])-prev); sum+=part/1000*r.cpm[i]; prev=BRK[i]; }
    if(fol>prev) sum+=(fol-prev)/1000*r.cpm[3];
    sum=Math.max(sum,r.min);
    return Math.round(sum/100)*100;
  }
  function fmtReco(pv,fol,m){var b=recoRate(pv,fol);return b?Math.round(b*m/100)*100:0;}
  function chanRange(k){
    var d=A.chan[k]||{}, r=d.rates||{}, vs=Object.keys(r).map(function(x){return parseInt(r[x],10)||0;}).filter(function(x){return x>0;});
    if(!vs.length) return null;
    var lo=Math.min.apply(null,vs), hi=Math.max.apply(null,vs);
    return {n:vs.length,lo:lo,hi:hi,txt:'฿'+num(lo)+(hi>lo?('–฿'+num(hi)):'')};
  }
  function cpmAt(pv,fol){var r=RATE[pv]||RATE.ig;return fol<BRK[0]?r.cpm[0]:(fol<BRK[1]?r.cpm[1]:(fol<BRK[2]?r.cpm[2]:r.cpm[3]));}
  function basisTxt(pv,fol,rc){
    return 'อินฟลูที่ยอดใกล้ ๆ คุณ (<b>'+fmtK(fol)+'</b> บน '+plabel(pv)+') ส่วนใหญ่รับเท่านี้ — ปรับขึ้นลงได้ตามใจเลย';
  }

  /* ภาษีหัก ณ ที่จ่าย: งานที่จ่ายเกิน 1,000 บาทต้องหัก — โชว์ตัวอย่างจริงจะได้ไม่งงตอนเงินเข้า */
  function taxBox(cfg){

      +'<div class="taxrow"><span>หัก ณ ที่จ่าย '+cfg.wht+'%</span><b>− ฿'+num(cut)+'</b></div>'
      +'<div class="taxrow tot"><span>เงินเข้าบัญชีจริง</span><b>฿'+num(ex-cut)+'</b></div>'
      +'<div class="taxrow"><span>เราออกหนังสือรับรองการหักภาษีให้ทุกงาน เอาไปยื่นคืนภาษีได้</span></div></div>';

  function payValid(){
    if(!A.pay) return false;
    var cfg=PAYDOC[A.pay], d=A.payDocs||{files:{}}, ok=true;
    cfg.fields.forEach(function(f){
      if(!f.req) return;
      var el=host.querySelector('[data-pk="'+f.k+'"]'); if(!el) return;
      var v=(el.value||'').trim(), good=!!v;
      if(good&&f.digits) good=v.replace(/[^0-9]/g,'').length>=(f.k==='accno'?10:f.digits);
      el.classList.toggle('err',!good); if(!good) ok=false;
    });
    cfg.docs.forEach(function(dc){
      if(!dc.req) return;
      var has=!!(d.files||{})[dc.k];
      var el=host.querySelector('.doc[data-dk="'+dc.k+'"]');
      if(el) el.classList.toggle('err',!has);
      if(!has) ok=false;
    });

  // ---------- หน้ารวมหลายคำถาม ----------

  // อัปเดตเฉพาะบล็อกย่อย ไม่ re-render ทั้งหน้า
  function redrawSec(sq){
    var sec=host.querySelector('.gsec[data-s="'+sq.id+'"]'); if(!sec) return null;
    var body=sec.querySelector('.gbody');
    body.innerHTML=sq.type==='text'?gText(sq):(sq.type==='cards'?gCards(sq):(sq.type==='chipsother'?gChipsOther(sq):gProv(sq)));

  function bindGroup(q,scope){
    var R=scope||host;
    R.querySelectorAll('[data-g][data-v]').forEach(function(b){ b.addEventListener('click',function(){
      var id=b.dataset.g, sq=SUB[id];
      A[id]=b.dataset.v;
      if(sq&&sq.nest){ redrawSec(sq); }                      // มีบล็อกยืด-หด ต้องวาดใหม่เฉพาะบล็อกนี้
      else {
        /* การ์ดแบบเต็มใบถูกห่อด้วย .optwrap ทีละใบ parentNode จึงเห็นแค่ปุ่มตัวเอง
           ต้องถอยไปที่กล่องของคำถามนั้นก่อน ไม่งั้นตัวเลือกเก่าไม่ถูกปลด */
        var box=b.closest('.gbody')||b.closest('.opts')||b.closest('.chips')||b.parentNode;
        box.querySelectorAll('[data-g="'+id+'"][data-v]').forEach(function(x){ x.classList.toggle('on',x===b); });
        var nst=b.closest('.nest'); if(nst){ var r2=nst.querySelector('.req2'); if(r2) r2.textContent='เลือกแล้ว'; }
      }
      syncGroupGate(); renderSummary();
    }); });
    R.querySelectorAll('[data-gm]').forEach(function(b){ b.addEventListener('click',function(){
      var id=b.dataset.gm, d=A[id]||{sel:[],other:'',otherOn:false};
      var ex=(SUB[id]||{}).excl;
      if(b.dataset.o){ d.otherOn=!d.otherOn; if(!d.otherOn) d.other='';
        if(d.otherOn&&ex) d.sel=d.sel.filter(function(x){return x!==ex;}); }
      else if(ex&&b.dataset.v===ex){
        var had=d.sel.indexOf(ex)>-1;
        d.sel=had?[]:[ex]; if(!had){ d.otherOn=false; d.other=''; }
      }
      else { if(ex) d.sel=d.sel.filter(function(x){return x!==ex;});
        var i=d.sel.indexOf(b.dataset.v); if(i>-1) d.sel.splice(i,1); else d.sel.push(b.dataset.v); }
      A[id]=d; redrawSec(SUB[id]); syncGroupGate(); renderSummary();
      if(A[id].otherOn){ var oi=host.querySelector('[data-go="'+id+'"]'); if(oi) oi.focus(); }
    }); });
    R.querySelectorAll('[data-go]').forEach(function(i){ i.addEventListener('input',function(){
      var id=i.dataset.go, d=A[id]||{sel:[],other:'',otherOn:false}; d.other=i.value; A[id]=d; renderSummary(); }); });
    R.querySelectorAll('input[data-g][data-k]').forEach(function(i){ i.addEventListener('input',function(){
      var id=i.dataset.g; A[id]=A[id]||{}; A[id][i.dataset.k]=i.value.trim(); i.classList.remove('err');
      if(i.dataset.type==='date') setAge(id,i);
      syncGroupGate(); renderSummary();
    }); i.addEventListener('change',function(){ if(i.dataset.type==='date') setAge(i.dataset.g,i); renderSummary(); });
      if(i.dataset.type==='date') setAge(i.dataset.g,i); });
    var sel=R.querySelector('[data-gp]');
    if(sel) sel.addEventListener('change',function(){ var v=sel.value; sel.value=''; if(!v)return;
      if(A.province.indexOf(v)>-1) return;
      if(A.province.length>=3){ var e=document.getElementById('get'); e.textContent='เลือกได้สูงสุด 3 จังหวัด'; e.classList.add('show'); setTimeout(function(){e.classList.remove('show');e.textContent='ยังขาดอีกนิดนึง ดูช่องที่ไฮไลต์ไว้';},1500); return; }
      A.province.push(v); redrawSec(SUB.province); renderSummary(); });
    R.querySelectorAll('[data-gpbox] .chip').forEach(function(b){ b.addEventListener('click',function(){
      A.province=A.province.filter(function(x){return x!==b.dataset.p;}); redrawSec(SUB.province); renderSummary(); }); });
  }
  function syncGroupGate(){
    var q=curQ(); if(!q||q.type!=='group'||!LOCK) return;
    var e=document.getElementById('get'); if(e) e.classList.remove('show');
  }
  function setAge(id,inp){
    var o=host.querySelector('[data-age="'+id+'"]'); if(!o) return;
    var dt=new Date(inp.value); if(isNaN(dt.getTime())){ o.textContent=''; return; }
    var t=new Date(),a=t.getFullYear()-dt.getFullYear(),m=t.getMonth()-dt.getMonth();
    if(m<0||(m===0&&t.getDate()<dt.getDate()))a--;
    o.textContent=(a>=0&&a<120)?('อายุ '+a+' ปี'):'';
    A[id]=A[id]||{}; A[id].age=(a>=0&&a<120)?a:'';
  }
  function groupValid(q){
    var ok=true;
    q.sumSubs.forEach(function(sid){
      var sq=SUB[sid]; if(!sq) return;
      if(sid==='faculty'&&A.job!=='student') return;
      if(sid==='field'&&A.job!=='work') return;
      if(sq.type==='text'){
        sq.fields.forEach(function(f){
          var i=host.querySelector('input[data-g="'+sq.id+'"][data-k="'+f.k+'"]'); if(!i) return;
          var v=i.value.trim(), good=true;
          if(f.req&&!v) good=false;
          if(good&&v&&f.type==='email') good=/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
          if(good&&v&&f.type==='phone') good=/^[0-9]{9,10}$/.test(v.replace(/[-\s]/g,''));
          i.classList.toggle('err',!good); if(!good) ok=false;
        });
      } else if(sq.req&&!A[sq.id]) ok=false;
    });
    if(!ok) document.getElementById('get').classList.add('show');
    return ok;
  }
  // ---------- หน้าโปรไฟล์สรุป ----------
  var GRAD=[['#FFD9E1','#FFB3C6'],['#D9E8FF','#B3CCFF'],['#DDF5E3','#B6E5C6'],['#FFE9CC','#FFD1A3'],['#E8DDFF','#CFBAFF'],['#D6F3F5','#AEE4E9'],['#FFE3D6','#FFC2A8'],['#E4EDD6','#C8DDAE']];
  var CAPS=['รีวิว{c}ที่ใช้จริงมา 1 เดือน บอกเลยว่า…','พาไปตาม{c}ที่คนพูดถึงเยอะสุดตอนนี้','5 ไอเทม{c}ที่ซื้อซ้ำไม่เคยพลาด','{c} งบไม่ถึงพัน แต่คุณภาพเกินราคา','อัปเดต{c}ประจำเดือนนี้ ของใหม่มาเพียบ','เปรียบเทียบ{c} 3 แบบ อันไหนคุ้มกว่ากัน'];
  function pick(arr,h){ return arr[Math.abs(h>>>0)%arr.length]; }
  function sampleTiles(k){
    var p=pobj(k), d=A.chan[k]||{}, fol=d.fol||10000;
    var cats=(A.cats&&A.cats.length)?A.cats:['ไลฟ์สไตล์'];
    var out='';
    for(var i=0;i<3;i++){
      var h=hashn(k+'|'+i+'|'+(d.link||''));
      var cat=cats[(i+hashn(k))%cats.length];
      var em=(CATS.filter(function(x){return x[1]===cat;})[0]||['✨'])[0];
      var g=pick(GRAD,h), cap=pick(CAPS,h>>>3).replace('{c}',cat);
      var likes=Math.round(fol*(0.03+(h%70)/1000)), cm=Math.round(likes*(0.02+(h%40)/1000));
      var vid=(k==='tiktok'||k==='youtube'||(h%3===0));
      var dur=(15+(h%160));
      out+='<div class="tile" style="--g1:'+g[0]+';--g2:'+g[1]+'">'
        +'<div class="th"><span class="pb2">'+p.svg+'</span><span class="emo">'+em+'</span>'
        +(vid?('<span class="dur">'+Math.floor(dur/60)+':'+('0'+(dur%60)).slice(-2)+'</span>'):'')+'</div>'
        +'<div class="tc">'+cap+'</div>'
        +'<div class="tm"><span>\u2665 '+fmtK(likes)+'</span><span>\uD83D\uDCAC '+fmtK(cm)+'</span><span>'+(2+(h%26))+' วันก่อน</span></div>'
        +'</div>';
    }
    return out;
  }
  function contentHTML(){

    +'<div class="simnote"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg><span>ภาพและตัวเลขในส่วนนี้เป็นตัวอย่างจำลองสำหรับพรีวิวเท่านั้น ระบบจริงจะดึงโพสต์ล่าสุดจากช่องที่เชื่อมบัญชีไว้ ส่วนช่องที่ยังไม่เชื่อมจะขึ้นให้เชื่อมก่อน</span></div>';
  }
  function totalFol(){ return (A.plats||[]).reduce(function(t,k){return t+((A.chan[k]||{}).fol||0);},0); }
  function minRate(){
    var vs=[]; (A.plats||[]).forEach(function(k){ var r=chanRange(k); if(r) vs.push(r.lo); });

  function bindRow(row){
      var k=row.dataset.k, p=pobj(k);
      var lk=row.querySelector('.lk');
      var fl=row.querySelector('.fl'), cb=row.querySelector('.cbtn'), le=row.querySelector('.lerr');
      A.chan[k]=A.chan[k]||{link:'',fol:0,src:'',rates:{},touched:{}};

      row.querySelector('.pl-h').addEventListener('click',function(){
        var on=row.classList.toggle('on');
        A.plats=A.plats||[];
        var i=A.plats.indexOf(k);
        if(on){ if(i<0) A.plats.push(k); setTimeout(function(){lk.focus();},220); }
        else if(i>-1) A.plats.splice(i,1);
        refreshRow(row); syncGate();
      });

      var t=null;
      lk.addEventListener('input',function(){
        var st=linkState(p,lk.value);
        A.chan[k].link=lk.value.trim();
        lk.classList.toggle('err',!!(lk.value.trim()&&!st.ok));
        le.textContent=st.msg; le.className=st.msg?'lerr show':'lerr';
        clearTimeout(t);
        if(p.fetch!=='api'){ refreshRow(row); syncGate(); return; }
        // YouTube เท่านั้น: ดึงจากลิงก์ได้จริงด้วย API key
        if(!st.ok){ A.chan[k].fol=0; A.chan[k].src=''; refreshRow(row); syncGate(); return; }
        var fo=row.querySelector('.fol'); fo.className='fol load';
        fo.querySelector('span').textContent='กำลังเรียก YouTube Data API…';
        t=setTimeout(function(){
          A.chan[k].fol=fakeFol(A.chan[k].link); A.chan[k].src='api';
          autoRates(k,row);
          rebuildRow(row,null);
        },700);
      });

      if(fl) fl.addEventListener('input',function(){
        fl.value=fl.value.replace(/[^0-9]/g,'');
        A.chan[k].fol=parseInt(fl.value,10)||0;
        if(A.chan[k].src!=='connect') A.chan[k].src='self';
        autoRates(k,row); rebuildRow(row,'.fl');
      });

      if(cb) cb.addEventListener('click',function(){
        if(A.chan[k].src==='connect') return;
        cb.textContent='กำลังเชื่อม…';
        setTimeout(function(){
          A.chan[k].src='connect';
          A.chan[k].fol=fakeFol(A.chan[k].link||k);
          A.chan[k].touched=false;
          autoRates(k,row);
          rebuildRow(row,null);
        },800);
      });

      row.querySelectorAll('.fx').forEach(function(fx){
        var fk=fx.dataset.f, f=p.fmts.filter(function(x){return x.k===fk;})[0], inp=fx.querySelector('.fxi');
        fx.addEventListener('click',function(e){
          if(e.target.closest('.fxr')) return;
          var d=A.chan[k]; d.rates=d.rates||{}; d.touched=d.touched||{};
          if(d.rates[fk]!=null){ delete d.rates[fk]; delete d.touched[fk]; inp.value=''; }
          else { var v=fmtReco(k,d.fol||0,f.m); d.rates[fk]=v?String(v):''; inp.value=v||''; }
          refreshRow(row); syncGate();
        });
        inp.addEventListener('input',function(){
          inp.value=inp.value.replace(/[^0-9]/g,'');
          var d=A.chan[k]; d.rates=d.rates||{}; d.touched=d.touched||{};
          d.rates[fk]=inp.value; d.touched[fk]=true;
          refreshRow(row); syncGate();
        });
      });
      var ab=row.querySelector('.allbtn');
      if(ab) ab.addEventListener('click',function(){
        /* ปุ่มเดียวเติมครบทุกฟอร์แมต ไม่ใช่แค่ฟอร์แมตที่ติ๊กไว้ก่อนหน้า */
        var d=A.chan[k]; d.rates={}; d.touched={};
        p.fmts.forEach(function(f){
          var v=fmtReco(k,d.fol||0,f.m); d.rates[f.k]=v?String(v):'';
        });
        rebuildRow(row,null);
      });
      refreshRow(row);
  }

        +'<div class="chips" id="provBox">'+A.province.map(function(p){return '<button class="chip on" data-p="'+p+'">'+p+' \u2715</button>';}).join('')+'</div>'
        +'<div class="err-txt warn-txt" id="et">เลือกได้สูงสุด 3 จังหวัด</div>'+navHtml(true,'ถัดไป',true);
      host.innerHTML='<div class="card">'+h+'</div>';
      var sel=document.getElementById('provSel');
      sel.addEventListener('change',function(){ var v=sel.value; sel.value=''; if(!v)return; if(A.province.indexOf(v)>-1)return; if(A.province.length>=3){ var et=document.getElementById('et'); et.classList.add('show'); setTimeout(function(){et.classList.remove('show');},1500); return; } A.province.push(v); render(); });
      host.querySelectorAll('#provBox .chip').forEach(function(b){ b.addEventListener('click',function(){ A.province=A.province.filter(function(x){return x!==b.dataset.p;}); render(); }); });
    }
    var bk=document.getElementById('bk'); if(bk) bk.addEventListener('click',goBack);
    var nx=document.getElementById('nx'); if(nx) nx.addEventListener('click',function(){ if(validate(q)) commit(q); });
    renderSummary(); toTop();
  }
  function toTop(){
    if(window.scrollY>0) window.scrollTo({top:0,left:0,behavior:'auto'});
    if(document.scrollingElement) document.scrollingElement.scrollTop=0;
  }

  function validate(q){
    if(q.type==='platrate') return LOCK?platValid():true;
    if(q.type==='group') return LOCK?groupValid(q):true;
    if(q.type==='payopt') return LOCK?payValid():true;
    if(!LOCK) return true;
    if(q.type==='chips'){ return (A[q.id]||[]).length>=(q.min||1); }
    if(q.type==='text'){
      var ok=true;
      host.querySelectorAll('input[data-k]').forEach(function(i){
        var req=q.fields.filter(function(f){return f.k===i.dataset.k;})[0].req;
        var v=i.value.trim(), t=i.dataset.type, good=true;
        if(req&&!v) good=false;
        if(good&&v&&t==='email') good=/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
        if(good&&v&&t==='phone') good=/^[0-9]{9,10}$/.test(v.replace(/[-\s]/g,''));
        i.classList.toggle('err',!good); if(!good)ok=false;
      });
      if(!ok) document.getElementById('et').classList.add('show'); return ok;
    }
    if(q.type==='consent') return !!A.consent;
    return true;
  }
  function platValid(){
    var rows=[].slice.call(host.querySelectorAll('.pl.on')), ok=rows.length>0;
    rows.forEach(function(row){
      var p=pobj(row.dataset.k), d=A.chan[row.dataset.k]||{};
      var lk=row.querySelector('.lk'), fl=row.querySelector('.fl');
      var st=linkState(p,lk.value), f=(d.fol||0)>0;
      var r=Object.keys(d.rates||{}).some(function(x){return parseInt(d.rates[x],10)>0;});
      lk.classList.toggle('err',!st.ok);
      if(fl) fl.classList.toggle('err',!f);
      if(!st.ok||!r||!f) ok=false;
    });
    return ok;
  }
  function commit(q){
    if(q.type==='group'){
      q.subs.forEach(function(sid){ var sq=SUB[sid]; if(sq.type!=='text') return;
        var d=A[sq.id]||{};
        host.querySelectorAll('input[data-g="'+sq.id+'"][data-k]').forEach(function(i){ d[i.dataset.k]=i.value.trim(); });
        if(sq.id==='basic'&&d.dob){ var dt=new Date(d.dob),t=new Date(),a=t.getFullYear()-dt.getFullYear(),m=t.getMonth()-dt.getMonth();
          if(m<0||(m===0&&t.getDate()<dt.getDate()))a--; d.age=(a>=0&&a<120)?a:''; }
        A[sq.id]=d; });
      if(A.job!=='student') delete A.faculty;
      if(A.job!=='work') delete A.field;
    }
    if(q.type==='text'){ var d={}; host.querySelectorAll('input[data-k]').forEach(function(i){ d[i.dataset.k]=i.value.trim(); });
      if(q.id==='basic'&&d.dob){ var dt=new Date(d.dob),t=new Date(),a=t.getFullYear()-dt.getFullYear(),m=t.getMonth()-dt.getMonth(); if(m<0||(m===0&&t.getDate()<dt.getDate()))a--; d.age=(a>=0&&a<120)?a:''; }
      A[q.id]=d; }
    if(q.type==='platrate'){
      var c={},ps=[];
      host.querySelectorAll('.pl.on').forEach(function(row){
        var k=row.dataset.k, prev=A.chan[k]||{};
        ps.push(k);
        var rr={}; Object.keys(prev.rates||{}).forEach(function(x){ if(parseInt(prev.rates[x],10)>0) rr[x]=prev.rates[x]; });
        c[k]={link:row.querySelector('.lk').value.trim(),fol:prev.fol||0,src:prev.src||'',rates:rr,touched:prev.touched||{}};
      });
      A.plats=ps; A.chan=c;
    }
    if(q.type==='chipsother'){ var dd=A[q.id]||{sel:[],other:'',otherOn:false};
      var oi=document.getElementById('oin'); dd.other=oi?oi.value.trim():''; A[q.id]=dd; }
    if(q.type==='upload'){ var pf=document.getElementById('pf'); A.portfolio={link:(document.getElementById('pl').value||'').trim(),files:pf&&pf.files?pf.files.length:0}; }
    goNext();
  }

  function finish(){
    document.getElementById('pseg').innerHTML=order.map(function(){return '<i class="done"></i>';}).join('');
    document.getElementById('psec').textContent='เสร็จแล้ว!'; document.getElementById('pnum').textContent='';
    toTop();
    host.innerHTML='<div class="card done"><div class="big"><svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg></div><h2>เรียบร้อย! ยินดีต้อนรับสู่ครอบครัว STAR 🎉</h2><p>โปรไฟล์ของคุณเข้าสู่ระบบแล้ว! ทีมงานจะรีบเข้าไปส่องและยืนยันกลับไปให้ไวที่สุด ระหว่างนี้ไปกดรับงานแคมเปญสนุกๆ ในแอป Sale Here รอได้เลยน้า 💖</p><button class="btn primary" id="rs">เริ่มใหม่</button></div>';
    document.getElementById('rs').addEventListener('click',function(){ A={}; idx=0; render(); });
    renderSummary();
  }
  // ---------- แถบพรีวิว: เดินดูได้ทุกหน้า ----------
  var PRE={fashion:function(){A.cats=A.cats||[]; if(A.cats.indexOf('แฟชั่น')<0) A.cats.unshift('แฟชั่น');}};
  function demoFill(){
    A={type:'Creator',
      plats:['ig','tiktok','youtube'],
      chan:{ig:{link:'https://instagram.com/mae.review',fol:24800,src:'connect',rates:{post:'1800',carousel:'2300',reels:'2900'},touched:{}},
            tiktok:{link:'https://tiktok.com/@mae.review',fol:86200,src:'self',rates:{short:'5400',long:'8100',live:'14000'},touched:{}},
            youtube:{link:'https://youtube.com/@maereview',fol:12400,src:'api',rates:{integrated:'2900',dedicated:'5200'},touched:{}}},
      cats:['แฟชั่น','คาเฟ่','ท่องเที่ยว'],
      fashion:{w:'48',h:'165',b1:'32',b2:'25',b3:'35',shoe:'23'},
      limit:{sel:['ไม่รับงานแอลกอฮอล์ / บุหรี่ / บุหรี่ไฟฟ้า','ไม่รับงานสินเชื่อ / คริปโต'],other:'ไม่รับงานที่ต้องค้างคืนต่างจังหวัด',otherOn:true},
      draft:'2 ครั้ง', days:'ทุกวัน', time:'บ่าย',
      province:['กรุงเทพมหานคร','นนทบุรี'],
      name:{fullname:'มณีรัตน์ ใจดี',phone:'0812345678',email:'mae@salehere.co.th',line:'@maereview'},
      basic:{dob:'1998-04-12',nation:'ไทย',age:28},
      gender:'หญิง', religion:'พุทธ', job:'work', field:'การตลาด',
      pay:'นามบุคคล',
      payDocs:{bank:'กสิกรไทย',accno:'1234567890',accname:'มณีรัตน์ ใจดี',
               files:{book:'bankbook.pdf · 210 KB'}},
      consent:true};
    applyDefaults(); rebuild(); idx=1; render();   /* ข้ามหน้าต้อนรับไปที่ข้อแรกเลยตอนตรวจงาน */
  }
  /* แถบพรีวิวถูกตัดออกจากหน้าจอแล้ว เหลือทางลัดไว้ให้ทีมใช้ตรวจงาน
     Shift+D = เติมข้อมูลตัวอย่าง · Shift+R = ล้าง · Shift+L = สลับบังคับกรอก */
  applyDefaults();
  document.addEventListener('keydown',function(e){
    if(!e.shiftKey||e.metaKey||e.ctrlKey||e.altKey) return;
    var t=e.target.tagName; if(t==='INPUT'||t==='SELECT'||t==='TEXTAREA') return;
    var k=(e.key||'').toLowerCase();
    if(k==='d'){ demoFill(); }
    else if(k==='r'){ A={}; applyDefaults(); idx=0; rebuild(); render(); }
    else if(k==='l'){ LOCK=!LOCK; render(); }
  });
  render();
})();
</script>
