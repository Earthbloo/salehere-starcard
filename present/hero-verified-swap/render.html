<!doctype html>
<meta charset="utf-8">
<title>hero render</title>
<style>body{margin:0;background:transparent} #stage{display:inline-block}</style>
<div id="stage"></div>
<script type="module">
// เรนเดอร์ spec ด้วย web renderer จริง (sync-server/web/js) — ตัวเดียวกับ present/widget-colour-accent-nov25/render.html
import { parseSpec } from '/js/spec-model.js'
import { WebMeasurer, loadFonts } from '/js/measure.js'
import { Profile, WebSpecData } from '/js/data.js'
import { mountWidget } from '/js/chrome.js'
import { paintBackdrop } from '/js/backdrop.js'
import { themeOf } from '/js/backdrop-tray.js'

await loadFonts('/fonts/')
const measurer = new WebMeasurer()
const profile = new Profile({ values: { name: 'Earth', about: 'รีวิวสกินแคร์ตรง ๆ ใช้จริงก่อนพูด ชอบเที่ยวคาเฟ่และหาของอร่อยทั่วกรุงเทพ' }, list: { categories: ['ความงาม', 'ท่องเที่ยว', 'อาหาร'] }, intake: { kind: 'creator', availability: { provinces: ['กรุงเทพ'] } } }, {})

window.render = async (json, opts = {}) => {
  const stage = document.getElementById('stage'); stage.innerHTML = ''
  const theme = themeOf({ backdrop: 'solid', primary: opts.card || '#3B3B3D', secondary: null, tone: opts.tone || 'dark' })
  const spec = parseSpec(structuredClone(json))
  const W = opts.w || json.design.w, H = opts.h || json.design.h, M = 14
  const cell = document.createElement('div')
  cell.id = 'cell'
  cell.style.cssText = `position:relative;width:${W + M * 2}px;height:${H + M * 2}px`
  stage.appendChild(cell)
  paintBackdrop(cell, theme, W + M * 2, H + M * 2)
  const item = { id: '00000000-0000-0000-0000-000000000000', kind: json.kind, x: M, y: M, w: W, h: H,
                 surface: (json.widget?.surfaces || [])[0] || 'glass', border: false, kit: {}, options: {} }
  const env = { doc: { photos: {}, owner: {}, notes: {} }, theme, profile, specs: { [json.kind]: spec }, measurer, base: '/',
    imageURL: (id) => id, mock: null,
    makeData: (it) => new WebSpecData({ profile, item: it, sample: true, verified: true, inkLight: theme.inkStyle.isLight, surface: it.surface, duo: false, stamped: false, cutout: false, kitDark: json.widget?.on === 'dark' }) }
  mountWidget(cell, item, { x: M, y: M, width: W, height: H }, env)
  await Promise.race([Promise.all([...stage.querySelectorAll('img')].map((i) => i.complete ? 0 : new Promise((r) => { i.onload = i.onerror = r }))), new Promise((r) => setTimeout(r, 2500))])
}
window.ready = true
</script>
