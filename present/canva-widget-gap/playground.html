<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Widget Playground</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&family=Anuphan:wght@400;500;600;700&family=Kanit:wght@400;600;700;800&family=Prompt:wght@400;600;800&family=Bai+Jamjuree:wght@400;600;700&display=swap">
<style>
/* Layout: widget tabs on top; live stage (sticky) on the left, the widget's tray on the right; stacks on phones */
:root{
  --bg:#F4F4F2; --panel:#FFFFFF; --ink:#16181D; --ink-2:#5B616E; --ink-3:#8D93A0;
  --line:#E3E4E8; --chip:#F0F1F3; --sel:#16181D; --sel-ink:#FFFFFF; --accent:#E5322D; --warn:#B45309; --warn-bg:#FDF2E3; --new:#1D4ED8; --new-bg:#E8EEFC;
  --f-ui:"Anuphan","Noto Sans Thai",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1115; --panel:#191C22; --ink:#F2F3F5; --ink-2:#B3B9C5; --ink-3:#7E8796; --line:#2B2F37; --chip:#22262D; --sel:#F2F3F5; --sel-ink:#16181D; --accent:#FF5A54; --warn:#FBBF24; --warn-bg:#2E2412; --new:#93B4FF; --new-bg:#17223D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1115; --panel:#191C22; --ink:#F2F3F5; --ink-2:#B3B9C5; --ink-3:#7E8796; --line:#2B2F37; --chip:#22262D; --sel:#F2F3F5; --sel-ink:#16181D; --accent:#FF5A54; --warn:#FBBF24; --warn-bg:#2E2412; --new:#93B4FF; --new-bg:#17223D; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.55}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px;padding-block:28px 60px;display:flex;flex-direction:column;gap:18px}
h1{font-family:"Kanit",var(--f-ui);font-weight:600;font-size:clamp(26px,4vw,34px);line-height:1.2;margin:0}
.sub{color:var(--ink-2);max-width:70ch}
.sub a{color:var(--new)}
.top{display:flex;flex-direction:column;gap:6px}
.globals{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;font-size:13px;color:var(--ink-2)}
.globals label{display:flex;align-items:center;gap:8px}
select{font:inherit;font-size:13px;padding:5px 8px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
:focus-visible{outline:2px solid var(--new);outline-offset:2px}

.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.tabs button{flex:none;font:inherit;font-size:13.5px;font-weight:500;padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;white-space:nowrap}
.tabs button small{color:var(--ink-3);font-weight:400;margin-left:4px}
.tabs button[aria-pressed="true"]{background:var(--sel);color:var(--sel-ink);border-color:var(--sel)}
.tabs button[aria-pressed="true"] small{color:inherit;opacity:.65}

.app{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:start}
@media (max-width:900px){.app{grid-template-columns:1fr}}
.left{position:sticky;top:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
@media (max-width:900px){.left{position:static}}
.stage{border-radius:18px;min-height:460px;display:flex;align-items:center;justify-content:center;padding:40px 20px;overflow:auto}
.stage.dots{background-color:#F1EEE9;background-image:radial-gradient(rgba(0,0,0,.07) 1.2px,transparent 1.2px);background-size:14px 14px}
.stage.white{background:#FFFFFF;box-shadow:inset 0 0 0 1px #E6E6E6}
.stage.black{background:#121316}
.stage.photo{background:linear-gradient(135deg,#F7B7A3 0%,#E58AB5 35%,#8C7BF0 70%,#5CC8F0 100%)}
.stage>.wg,.stage .lab>.wg{max-width:100%}
.stage.all{flex-wrap:wrap;gap:34px 30px;align-items:flex-start;justify-content:center}
.stage .lab{display:flex;flex-direction:column;align-items:center;gap:10px}
.stage .lab>span{font-size:12px;font-weight:600;color:#6B6B6B;background:rgba(255,255,255,.75);padding:2px 10px;border-radius:999px}
.stage.black .lab>span{background:rgba(255,255,255,.12);color:#DDD}
.cap{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--ink-2)}
.cap .lock{display:flex;gap:6px;align-items:center}
.note{display:inline-flex;gap:6px;align-items:flex-start;background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:6px 10px;font-size:12.5px}
.note.new{background:var(--new-bg);color:var(--new)}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:16px}
.grp{display:flex;flex-direction:column;gap:8px}
.grp>.gl{font-size:12px;font-weight:600;color:var(--ink-3);display:flex;justify-content:space-between;gap:8px}
.grp>.gl em{font-style:normal;font-weight:400}
.sep{height:1px;background:var(--line);margin:2px -16px}
.sect{font-family:"Kanit",var(--f-ui);font-size:15px;font-weight:600;color:var(--ink)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{font:inherit;font-size:13.5px;padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--sel);color:var(--sel-ink);border-color:var(--sel)}
.seg button:disabled{opacity:.35;cursor:not-allowed}
.sw{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sw button,.sw label.pick{width:28px;height:28px;border-radius:50%;border:0;padding:0;cursor:pointer;box-shadow:0 0 0 1px rgba(0,0,0,.15) inset;position:relative}
.sw button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--sel)}
.sw button.auto{width:auto;border-radius:999px;padding:0 10px;font:inherit;font-size:12px;background:var(--chip);color:var(--ink);box-shadow:none;height:28px}
.sw button.auto[aria-pressed="true"]{background:var(--sel);color:var(--sel-ink)}
.sw label.pick{background:conic-gradient(#f43,#fd3,#3d6,#3cf,#63f,#f3c,#f43);display:block;overflow:hidden}
.sw label.pick input{opacity:0;width:100%;height:100%;cursor:pointer}
.checks{display:flex;flex-direction:column;gap:2px}
.checks label{display:flex;align-items:center;gap:10px;padding:5px 2px;cursor:pointer;font-size:13.5px}
.checks input{width:17px;height:17px;accent-color:var(--sel);margin:0}
.checks label em{margin-left:auto;font-style:normal;color:var(--ink-3);font-size:12px;font-variant-numeric:tabular-nums}
.checks label.off{opacity:.4;cursor:not-allowed}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.switch{position:relative;width:44px;height:26px;flex:none}
.switch input{opacity:0;width:100%;height:100%;margin:0;cursor:pointer;position:absolute;inset:0;z-index:1}
.switch span{position:absolute;inset:0;border-radius:13px;background:var(--line);transition:background .15s}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .15s}
.switch input:checked+span{background:#34C759}
.switch input:checked+span::after{left:21px}
.switch input:disabled+span{opacity:.4}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stepper button{font:inherit;font-size:16px;width:36px;height:32px;border:0;background:transparent;color:var(--ink);cursor:pointer}
.stepper button:disabled{opacity:.3;cursor:not-allowed}
.stepper b{min-width:34px;text-align:center;border-inline:1px solid var(--line);line-height:32px;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--sel)}
.hint{font-size:12px;color:var(--ink-3)}
.minis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.mini{border:1px solid var(--line);border-radius:12px;background:var(--chip);height:86px;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;padding:0;position:relative}
.mini[aria-pressed="true"]{box-shadow:0 0 0 2px var(--sel);border-color:var(--sel)}
.mini .sc{transform-origin:center;pointer-events:none}
.mininame{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;font-size:10.5px;color:var(--ink-3);text-align:center;margin-top:-2px}
.btnline{font:inherit;font-size:13px;border:1px solid var(--line);background:transparent;color:var(--ink-2);border-radius:10px;padding:7px 12px;cursor:pointer}
.upl{font-size:12.5px;color:var(--new);cursor:pointer;text-decoration:underline}
.upl input{display:none}

/* ============ WIDGETS (artwork; fixed colours by design) ============ */
.wg{width:var(--w);position:relative;font-family:var(--df);color:var(--ink);line-height:1.3;flex:none;-webkit-font-smoothing:antialiased}
.wg .t{font-family:var(--tf);color:var(--tc);font-weight:800;font-size:22px;line-height:1.2;outline:none;border-radius:4px;min-width:20px}
.wg .t:focus{box-shadow:0 0 0 2px #2F6BF0}
.wg .mut{color:var(--mut)}
.wg .acc{color:var(--acc)}
.wg .ico{display:inline-block;flex:none;vertical-align:middle}
.wg .ico svg{display:block;width:100%;height:100%}
.wg .col{display:flex;flex-direction:column;min-width:0}
.wg .stack{display:flex;flex-direction:column;gap:7px}
.wg .cen{display:flex;flex-direction:column;align-items:center;text-align:center}
.wg .rw{display:flex;align-items:center;gap:10px;min-width:0}
.wg .rw .end{margin-left:auto;text-align:right;white-space:nowrap}
.wg .grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
.wg .full{grid-column:1/-1}
.wg .ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wg .ph{background:#D6D6D6;display:flex;align-items:center;justify-content:center;color:#8E8E8E;aspect-ratio:16/10;border-radius:5px}
.wg .avatar{border-radius:50%;overflow:hidden;flex:none}
.wg .avatar img,.wg .avatar svg{width:100%;height:100%;object-fit:cover;display:block}

/* purple sticker */
.s-purple{background:var(--bgc);border:2.5px solid var(--bcx);border-radius:var(--r);box-shadow:var(--sh);padding:12px 12px 14px}
.s-purple .blk{background:#fff;border:2px solid #141414;border-radius:8px;color:#141414}
.s-purple .btn{display:inline-flex;align-items:center;gap:6px;background:#fff;border:2px solid #141414;border-radius:8px;box-shadow:3px 3px 0 #141414;padding:5px 14px;font-weight:700;font-size:13px;color:#141414}
/* cream soft */
.s-cream{background:var(--bgc);border:1.5px solid var(--bcx);border-radius:var(--r);box-shadow:var(--sh);padding:14px}
.s-cream .t{font-weight:700;font-size:20px}
.s-cream .blk{background:var(--blk);border-radius:12px}
.s-cream .pill{display:inline-block;background:var(--blk2);border-radius:999px;padding:5px 14px;font-weight:600;font-size:12.5px}
/* sage grid frame */
.s-gingham{background:var(--bgc);border-radius:var(--r);padding:var(--gp)}
.s-gingham .card{background:#fff;border:2px solid var(--bcx);border-radius:var(--r2);padding:14px;color:#151515}
.s-gingham .card .mut{color:#7A7A7A}
.s-gingham .sepl{height:1px;background:#D9D9D9;margin:8px 0}
.s-gingham .box{background:#F2F2F2;border-radius:8px}
/* night neon */
.s-night{background:var(--bgc);border-radius:var(--r);padding:20px 20px 18px}
.s-night .t{font-weight:700;font-size:19px}
.s-night .br{position:absolute;width:30px;height:30px;border:3px solid var(--bc);pointer-events:none;display:var(--brd)}
.s-night .br.a{top:6px;left:6px;border-right:0;border-bottom:0;border-top-left-radius:var(--brr)}
.s-night .br.b{top:6px;right:6px;border-left:0;border-bottom:0;border-top-right-radius:var(--brr)}
.s-night .br.c{bottom:6px;left:6px;border-right:0;border-top:0;border-bottom-left-radius:var(--brr)}
.s-night .br.d{bottom:6px;right:6px;border-left:0;border-top:0;border-bottom-right-radius:var(--brr)}
.s-night .blk{background:var(--blk);border:1px solid var(--blkb);border-radius:10px}
.s-night .ibox{width:38px;height:38px;border:1.5px solid var(--acc);border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--acc);flex:none}
/* mac window */
.s-mac{background:var(--bgc);border:1px solid var(--bcx);border-radius:var(--r);overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.08),0 10px 26px rgba(0,0,0,.12)}
.s-mac .bar{display:grid;grid-template-columns:62px 1fr auto;align-items:center;height:34px;padding:0 10px;background:var(--barc);border-bottom:1px solid rgba(0,0,0,.07)}
.s-mac .lights{display:flex;gap:6px}
.s-mac .lights i{width:11px;height:11px;border-radius:50%;display:block}
.s-mac .bt{text-align:center;min-width:0}
.s-mac .bt .t{font-size:13px;font-weight:600;color:var(--tc2)}
.s-mac .tools{display:flex;gap:7px;color:var(--mut)}
.s-mac .tools .ico{width:14px;height:14px}
.s-mac .body{padding:4px 16px 10px}
.s-mac .ln{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--hair)}
.s-mac .ln:last-child{border-bottom:0}
.s-mac .chip{background:var(--blk);border-radius:7px;padding:5px 11px;font-weight:500;font-size:12.5px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="igG" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#FEDA75"/><stop offset=".3" stop-color="#FA7E1E"/><stop offset=".6" stop-color="#D62976"/><stop offset="1" stop-color="#4F5BD5"/></linearGradient>
    <linearGradient id="avG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F6D3C4"/><stop offset="1" stop-color="#C98F7E"/></linearGradient>
  </defs>
</svg>

<div class="wrap">
  <header class="top">
    <h1>Widget Playground</h1>
    <p class="sub">ทุก widget จาก Canva (หน้า 3–12) ครบ 5 สไตล์ ลองแต่งได้แบบเดียวกับในแอป · ข้อความบน widget แก้ไม่ได้ (ข้อมูลจริง + ป้ายตายตัว) · ภาพรวมอยู่ที่ <a href="https://claude.ai/artifact/H7S14KAMn2jncUBK31p64C">Widget ชุด 5 สไตล์</a> สเปกอยู่ที่ <a href="https://claude.ai/artifact/Xu2a5Gfca89MrJUkXVTD7Z">Widget Config ทีละใบ</a></p>
    <div class="globals">
      <label for="g-font">ฟอนต์ข้อมูล (ฟอนต์ธีมของการ์ด)
        <select id="g-font"><option value="noto">Noto Sans Thai</option><option value="anuphan">Anuphan</option><option value="kanit">Kanit</option><option value="prompt">Prompt</option><option value="bai">Bai Jamjuree</option></select></label>
      <span style="display:flex;align-items:center;gap:8px">พื้นการ์ด <span class="seg" id="g-stage">
        <button type="button" id="st-dots" data-v="dots">ครีมจุด</button><button type="button" id="st-white" data-v="white">ขาว</button><button type="button" id="st-black" data-v="black">ดำ</button><button type="button" id="st-photo" data-v="photo">รูป</button></span></span>
      <span style="display:flex;align-items:center;gap:8px">มุมมอง <span class="seg" id="g-view">
        <button type="button" id="vw-one" data-v="one">ทีละแบบ</button><button type="button" id="vw-all" data-v="all">ทั้ง 5 แบบ</button></span></span>
    </div>
  </header>

  <nav class="tabs" id="tabs" aria-label="เลือก widget"></nav>

  <div class="app">
    <div class="left">
      <div class="stage dots" id="stage"></div>
      <div class="cap" id="cap"></div>
    </div>
    <aside class="panel" id="panel" aria-label="ถาดแต่ง widget"></aside>
  </div>
</div>

<script>
(function(){
/* ---------------- icons ---------------- */
const S=(inner,vb='0 0 24 24')=>`<svg viewBox="${vb}" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;
const IC={
  calendar:(fill)=>fill?`<svg viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="16.5" rx="3" fill="currentColor"/><rect x="7" y="2.5" width="2.2" height="4.5" rx="1" fill="currentColor"/><rect x="14.8" y="2.5" width="2.2" height="4.5" rx="1" fill="currentColor"/><g fill="#fff"><rect x="5" y="8.5" width="14" height="1.4"/><circle cx="8" cy="12.6" r="1.15"/><circle cx="12" cy="12.6" r="1.15"/><circle cx="16" cy="12.6" r="1.15"/><circle cx="8" cy="16.6" r="1.15"/><circle cx="12" cy="16.6" r="1.15"/><circle cx="16" cy="16.6" r="1.15"/></g></svg>`
    :S('<rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/><g fill="currentColor" stroke="none"><circle cx="8" cy="13" r="1"/><circle cx="12" cy="13" r="1"/><circle cx="16" cy="13" r="1"/><circle cx="8" cy="16.6" r="1"/><circle cx="12" cy="16.6" r="1"/><circle cx="16" cy="16.6" r="1"/></g>'),
  pin:(fill)=>fill?`<svg viewBox="0 0 24 24"><path d="M12 22s-7-6.6-7-12a7 7 0 0 1 14 0c0 5.4-7 12-7 12z" fill="currentColor"/><circle cx="12" cy="10" r="2.6" fill="#fff"/></svg>`:S('<path d="M12 21.5s-6.5-6.2-6.5-11.3a6.5 6.5 0 0 1 13 0c0 5.1-6.5 11.3-6.5 11.3z"/><circle cx="12" cy="10.2" r="2.4"/>'),
  phone:(fill)=>fill?`<svg viewBox="0 0 24 24"><path fill="currentColor" d="M6.6 3h3l1.6 4.2-2.1 1.4a12.5 12.5 0 0 0 6.3 6.3l1.4-2.1L21 14.4v3a2.2 2.2 0 0 1-2.4 2.2A17.6 17.6 0 0 1 4.4 5.4 2.2 2.2 0 0 1 6.6 3z"/></svg>`:S('<path d="M6.6 3.5h3l1.5 4-2 1.3a12 12 0 0 0 6.1 6.1l1.3-2 4 1.5v3a2 2 0 0 1-2.2 2A17 17 0 0 1 4.6 5.7a2 2 0 0 1 2-2.2z"/>'),
  mail:(fill)=>fill?`<svg viewBox="0 0 24 24"><rect x="2.5" y="5" width="19" height="14" rx="2" fill="currentColor"/><path d="M3.5 6.5 12 13l8.5-6.5" fill="none" stroke="#fff" stroke-width="1.6"/></svg>`:S('<rect x="3" y="5.5" width="18" height="13" rx="2"/><path d="M3.5 7 12 13l8.5-6"/>'),
  image:()=>S('<rect x="3.5" y="4.5" width="17" height="15" rx="2"/><circle cx="15.5" cy="9" r="1.6"/><path d="M4 17.5l5-5 4 4 2.5-2.5 4.5 4"/>'),
  play:()=>`<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="currentColor"/><path d="M10 7.8v8.4l6.6-4.2z" fill="#fff"/></svg>`,
  sparkle:()=>S('<path d="M10 3.5l1.6 4.9 4.9 1.6-4.9 1.6L10 16.5l-1.6-4.9L3.5 10l4.9-1.6z"/><path d="M17.5 14.5l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8z"/>'),
  utensils:()=>S('<path d="M6 3v6.5a2.5 2.5 0 0 0 5 0V3M8.5 3v18M17 3c-2 0-3.2 2.4-3.2 5 0 2.4 1.3 4 3.2 4.2V21"/><path d="M17 3v9.2"/>'),
  sun:()=>S('<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/>'),
  lipstick:()=>S('<path d="M7.5 21h6v-8.5h-6zM8.5 12.5V8.3L12.5 5v7.5"/><circle cx="17.5" cy="17" r="3.5"/><path d="M15.2 19.3l4.6-4.6"/>'),

/* QR placeholder: three finder squares + seeded modules */
function qr(px,seed){
  const n=25,c=px/n;let r='';let s=seed||7;const rnd=()=>{s=(s*9301+49297)%233280;return s/233280};
  const fin=(x,y)=>`<rect x="${x*c}" y="${y*c}" width="${7*c}" height="${7*c}" fill="#111"/><rect x="${(x+1)*c}" y="${(y+1)*c}" width="${5*c}" height="${5*c}" fill="#fff"/><rect x="${(x+2)*c}" y="${(y+2)*c}" width="${3*c}" height="${3*c}" fill="#111"/>`;
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){const inF=(x<8&&y<8)||(x>n-9&&y<8)||(x<8&&y>n-9);if(!inF&&rnd()>.52)r+=`<rect x="${(x*c).toFixed(2)}" y="${(y*c).toFixed(2)}" width="${(c+.3).toFixed(2)}" height="${(c+.3).toFixed(2)}" fill="#111"/>`}
  return `<svg viewBox="0 0 ${px} ${px}" width="${px}" height="${px}" style="display:block;background:#fff">${r}${fin(0,0)}${fin(n-7,0)}${fin(0,n-7)}</svg>`;
}

function mix(a,b,t){const A=hex2rgb(a),B=hex2rgb(b);return '#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('')}

/* ---------------- rendering ---------------- */
function cssVars(st,look,ws,width,stageDark){
  const clear=look.mode==='clear';
  const baseDark=clear?stageDark:lum(look.fill)<.45;
  let bgc=look.mode==='solid'?look.fill:look.mode==='grad'?`linear-gradient(160deg,${shade(look.fill,.25)},${shade(look.fill,-.22)})`:'transparent';
  const r=look.corner==='round'||!look.border?RAD[st]:3;
  const ink=baseDark?'#F4F6F8':'#151515', mut=baseDark?'rgba(255,255,255,.6)':'rgba(0,0,0,.52)';
  const v={'--w':width+'px','--r':r+'px','--bc':look.bc,'--bcx':look.border?look.bc:'transparent','--ink':ink,'--mut':mut,
    '--df':FONTS[ST.font],'--tf':FONTS[ST.font]};
  let tc=ink;
  if(st==='purple'){v['--sh']=look.border&&!clear?`5px 5px 0 ${look.bc}`:'none'}
  if(st==='cream'){v['--sh']=clear?'none':'0 1px 2px rgba(0,0,0,.05),0 8px 18px rgba(0,0,0,.06)';
    v['--blk']=baseDark?mix(clear?'#222222':look.fill,'#ffffff',.08):mix(clear?'#FFFFFF':look.fill,'#ffffff',.55);
    v['--blk2']=baseDark?mix(clear?'#222222':look.fill,'#ffffff',.16):mix(clear?'#E6E1DA':look.fill,'#000000',.06);
    if(!baseDark)tc='#2B2B2B'}
  if(st==='gingham'){const grid='repeating-linear-gradient(0deg,rgba(55,65,25,.20) 0 1px,transparent 1px 13px),repeating-linear-gradient(90deg,rgba(55,65,25,.20) 0 1px,transparent 1px 13px)';
    bgc=clear?'transparent':`${grid},${look.mode==='grad'?bgc:`linear-gradient(${look.fill},${look.fill})`}`;
    v['--gp']=clear?'0px':'11px';v['--r2']=(look.corner==='round'||!look.border?RAD.gingham-7:2)+'px';
    tc='#111111'}
  if(st==='night'){v['--brd']=look.border?'block':'none';v['--brr']=look.corner==='round'?'10px':'0';
    v['--acc']=look.border?look.bc:(baseDark?'#5AC8F0':'#0E7FB0');
    v['--blk']=baseDark?'rgba(255,255,255,.035)':'rgba(0,0,0,.04)';
    v['--blkb']=look.border?`color-mix(in srgb,${look.bc} 30%,transparent)`:(baseDark?'rgba(255,255,255,.1)':'rgba(0,0,0,.1)')}
  if(st==='mac'){const f=clear?'#FAFAFA':look.fill;v['--barc']=lum(f)<.45?shade(f,.1):shade(f,-.055);
    v['--acc']=baseDark?'#6AA8FF':'#2F6FE4';v['--hair']=baseDark?'rgba(255,255,255,.1)':'rgba(0,0,0,.08)';
    v['--blk']=baseDark?'rgba(255,255,255,.08)':'#EDEDEF';v['--tc2']=lum(f)<.45?'#E8E8EA':'#4A4A4A'}
  if(st==='purple'||st==='cream')v['--acc']=ink;
  v['--tc']=tc;v['--bgc']=bgc;
  return Object.entries(v).map(([k,x])=>`${k}:${x}`).join(';');
}

function shell(st,html,bar,T){
  if(st==='gingham')return `<div class="card">${html}</div>`;
  if(st==='night')return `<i class="br a"></i><i class="br b"></i><i class="br c"></i><i class="br d"></i>${html}`;
  if(st==='mac')return `<div class="bar"><span class="lights"><i style="background:#FF5F57"></i><i style="background:#FEBC2E"></i><i style="background:#28C840"></i></span><span class="bt">${bar?T:''}</span><span class="tools">${['info','search','share','pencil','copy','more'].map(k=>ico(IC[k](),14)).join('')}</span></div><div class="body">${html}</div>`;
  return html;
}

  return {h:rows.map(([l,v])=>`<div class="ln"><b style="font-size:13.5px">${l}</b><span style="font-size:13px;white-space:nowrap">${v}</span></div>`).join(''),bar:true};
};

function widgetHTML(id,st,ws,opts,forMini,noEdit){
  const def=W.find(w=>w.id===id),look=forMini?LOOK0[st]:ws.look[st];
  const width=forMini?def.w[st]:(ws.w[st]||def.w[st]);
  const stageDark=ST.stage==='black'||ST.stage==='photo';
  const T=`<div class="t">${esc(def.title)}</div>`;
  const r=R[id](st,opts,T);
  return `<div class="wg s-${st}" style="${cssVars(st,look,ws,width,stageDark)}">${shell(st,r.h,r.bar,T)}</div>`;
}

/* ---------------- UI ---------------- */
const $=s=>document.querySelector(s);
const tabs=$('#tabs'),stage=$('#stage'),panel=$('#panel'),cap=$('#cap');
tabs.innerHTML=W.map(w=>`<button type="button" id="tab-${w.id}" data-id="${w.id}">${w.name}<small>หน้า ${w.page}</small></button>`).join('');
tabs.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;ST.wid=b.dataset.id;try{history.replaceState(null,'','#'+b.dataset.id)}catch(_){}save();renderAll()});
$('#g-font').addEventListener('change',e=>{ST.font=e.target.value;save();renderStage();renderMinis()});
$('#g-view').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;ST.view=b.dataset.v;save();renderAll()});
$('#g-stage').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;ST.stage=b.dataset.v;save();renderAll()});

function renderStage(){
  const ws=wstate(ST.wid);
  const all=ST.view==='all';
  stage.className='stage '+ST.stage+(all?' all':'');
  stage.innerHTML=all?STY.map(st=>`<div class="lab">${widgetHTML(ST.wid,st,ws,ws.o,false,true)}<span>${SNAME[st]}</span></div>`).join(''):widgetHTML(ST.wid,ws.style,ws,ws.o,false);
  const t=stage.querySelector('[data-title]');
  if(t){t.addEventListener('input',()=>{ws.title=t.textContent.trim()||W.find(w=>w.id===ST.wid).title;save()});
    t.addEventListener('blur',()=>renderMinis());
    t.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();t.blur()}})}
  const n=all?Object.entries(NOTES[ST.wid]||{}).map(([k,v])=>SNAME[k]+': '+v).join(' · '):(NOTES[ST.wid]||{})[ws.style];
  const emptyNew=ws.o.state==='empty'&&EMPTY_CANVA[ST.wid]&&(all||!EMPTY_CANVA[ST.wid].includes(ws.style));
  cap.innerHTML=`<div class="lock">🔒 ข้อความบน widget แก้ไม่ได้ · ข้อมูลดึงจาก Star Profile · หัวข้อเป็นป้ายตายตัว</div>`
    +(n?`<div><span class="note">Canva: ${n}</span></div>`:'')
    +(emptyNew?`<div><span class="note new">${all?'กลางคืนนีออนกับหน้าต่าง Mac: ':''}หน้าตอนยังไม่มีข้อมูลของสไตล์นี้ไม่มีใน Canva · ต้องออกแบบเพิ่ม</span></div>`:'');
}
function renderMinis(){
  const ws=wstate(ST.wid),box=$('#minis');if(!box)return;
  box.innerHTML=STY.map(st=>`<button type="button" class="mini" id="mini-${st}" data-st="${st}" aria-pressed="${st===ws.style}" aria-label="${SNAME[st]}"><div class="sc">${widgetHTML(ST.wid,st,ws,ws.o,true)}</div></button>`).join('');
  requestAnimationFrame(()=>box.querySelectorAll('.mini').forEach(m=>{const sc=m.firstElementChild,w=sc.scrollWidth||1,h=sc.scrollHeight||1;const k=Math.min((m.clientWidth-8)/w,(m.clientHeight-8)/h);sc.style.transform=`scale(${k})`}));
}
function seg(id,items,cur,dis){return `<div class="seg" data-seg="${id}">${items.map(([v,l])=>`<button type="button" id="${id}-${v}" data-v="${v}" aria-pressed="${String(cur)===String(v)}"${dis?' disabled':''}>${l}</button>`).join('')}</div>`}
function swatches(id,cols,cur,withAuto,withPick){
  return `<div class="sw" data-sw="${id}">${withAuto?`<button type="button" class="auto" id="${id}-auto" data-v="auto" aria-pressed="${cur==='auto'}">อัตโนมัติ</button>`:''}${cols.map(c=>`<button type="button" id="${id}-${c.slice(1)}" data-v="${c}" style="background:${c}" aria-label="${c}" aria-pressed="${cur&&cur.toLowerCase()===c.toLowerCase()}"></button>`).join('')}${withPick?`<label class="pick" title="เลือกสีเอง"><input type="color" id="${id}-pick" data-pick="${id}" value="${cur&&cur.startsWith('#')?cur:'#888888'}" aria-label="เลือกสีเอง"></label>`:''}</div>`}

function renderPanel(){
  const def=W.find(w=>w.id===ST.wid),ws=wstate(ST.wid),st=ws.style,look=ws.look[st],o=ws.o;
  let h=`<div class="grp"><div class="gl"><span class="sect" style="font-size:15px">${def.name}</span><em>Canva หน้า ${def.page}</em></div></div>`;
  h+=`<div class="grp"><div class="gl">แบบ <em>${SNAME[st]}</em></div><div class="minis" id="minis"></div><div class="mininame">${STY.map(s=>`<span>${SNAME[s]}</span>`).join('')}</div></div><div class="sep"></div>`;
  h+=`<div class="sect">เนื้อหา</div>`;
  def.opts.forEach(p=>{
    if(p.when&&!p.when(o))return;
    const na=p.styles&&!p.styles.includes(st);
    const hint=na?`<div class="hint">สไตล์${SNAME[st]}ใน Canva ไม่มีส่วนนี้</div>`:'';
    if(p.type==='seg'){h+=`<div class="grp"><div class="gl">${p.label}${p.sub?`<em>${p.sub}</em>`:''}</div>${seg('o-'+p.k,p.items,o[p.k],na)}${p.upload&&o.photo==='has'?`<label class="upl">อัปโหลดรูปของคุณ<input type="file" accept="image/*" id="o-upload"></label>`:''}${hint}</div>`}
    if(p.type==='switch'){h+=`<div class="grp"><div class="row"><span>${p.label}${p.sub?` <span class="hint">· ${p.sub}</span>`:''}</span><label class="switch"><input type="checkbox" id="o-${p.k}" data-sw-opt="${p.k}" ${o[p.k]&&!na?'checked':''} ${na?'disabled':''}><span></span></label></div>${hint}</div>`}
    if(p.type==='step'){const i=p.values.indexOf(o[p.k]);h+=`<div class="grp"><div class="row"><span>${p.label}</span><span class="stepper" data-step="${p.k}"><button type="button" id="o-${p.k}-dec" data-d="-1" ${i<=0?'disabled':''} aria-label="ลด">−</button><b>${o[p.k]}</b><button type="button" id="o-${p.k}-inc" data-d="1" ${i>=p.values.length-1?'disabled':''} aria-label="เพิ่ม">+</button></span></div></div>`}
    if(p.type==='checks'){const off=(p.off&&p.off[st])||[];
      h+=`<div class="grp"><div class="gl">${p.label}${p.max?`<em>สูงสุด ${p.max}</em>`:''}</div><div class="checks" data-checks="${p.k}">${p.items.map(([k,l,sub])=>{const isOff=off.includes(k),on=o[p.k].includes(k);
        const last=on&&o[p.k].length<=(p.min||0),full=!on&&p.max&&o[p.k].length>=p.max;
        return `<label class="${isOff?'off':''}" for="c-${p.k}-${k}"><input type="checkbox" id="c-${p.k}-${k}" data-k="${k}" ${on&&!isOff?'checked':''} ${isOff||last||full?'disabled':''}>${l}<em>${isOff?'ไม่มีใน Canva':(sub||'')}</em></label>`}).join('')}</div></div>`}
  });
  h+=`<div class="sep"></div><div class="sect">กล่อง</div>
    <div class="grp"><div class="gl">พื้นหลัง</div>${seg('l-mode',[['solid','สีพื้น'],['grad','ไล่สี'],['clear','โปร่ง']],look.mode)}</div>
    ${look.mode!=='clear'?`<div class="grp"><div class="gl">สีพื้น</div>${swatches('l-fill',FILLS,look.fill,false,true)}</div>`:''}
    <div class="grp"><div class="gl">ขอบ</div>${seg('l-border',[['on','มีขอบ'],['off','ไม่มีขอบ']],look.border?'on':'off')}</div>
    ${look.border?`<div class="grp"><div class="gl">มุม</div>${seg('l-corner',[['round','มน'],['square','เหลี่ยม']],look.corner)}</div>
    <div class="grp"><div class="gl">สีขอบ${st==='night'?' <em>สีตัวเลขตามสีนี้</em>':st==='purple'?' <em>เงาตามสีนี้</em>':''}</div>${swatches('l-bc',BCOLS,look.bc,false,true)}</div>`:''}
    <div class="grp"><div class="gl">ความกว้าง <em>${ws.w[st]||def.w[st]} px</em></div><input type="range" id="l-w" min="200" max="440" step="2" value="${ws.w[st]||def.w[st]}" aria-label="ความกว้าง widget"></div>
    <button type="button" class="btnline" id="l-reset">คืนค่าสไตล์นี้ตาม Canva</button>`;
  panel.innerHTML=h;
  renderMinis();
}
function renderAll(){
  tabs.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.id===ST.wid)));
  $('#g-font').value=ST.font;
  document.querySelectorAll('#g-stage button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===ST.stage)));
  document.querySelectorAll('#g-view button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===(ST.view||'one'))));
  renderStage();renderPanel();
}
panel.addEventListener('click',e=>{
  const ws=wstate(ST.wid),st=ws.style,look=ws.look[st],def=W.find(w=>w.id===ST.wid);
  const mini=e.target.closest('.mini');if(mini){ws.style=mini.dataset.st;save();renderStage();renderPanel();return}
  const b=e.target.closest('button');if(!b)return;
  const sg=b.closest('[data-seg]'),sw=b.closest('[data-sw]'),stp=b.closest('[data-step]');
  if(sg){const id=sg.dataset.seg,v=b.dataset.v;
    if(id.startsWith('o-'))ws.o[id.slice(2)]=v;
    if(id==='t-font')ws.tfont=v;
    if(id==='l-mode')look.mode=v;
    if(id==='l-border')look.border=v==='on';
    if(id==='l-corner')look.corner=v;}
  if(sw){const id=sw.dataset.sw,v=b.dataset.v;
    if(id==='t-col')ws.tcol=v;
    if(id==='l-fill'){look.fill=v;ws.tcol='auto'}
    if(id==='l-bc')look.bc=v;}
  if(stp){const p=def.opts.find(q=>q.k===stp.dataset.step),i=p.values.indexOf(ws.o[p.k])+(+b.dataset.d);if(i>=0&&i<p.values.length)ws.o[p.k]=p.values[i]}
  if(b.id==='l-reset'){ws.look[st]={...LOOK0[st]};delete ws.w[st];ws.tcol='auto';ws.tfont='same'}
  save();renderStage();renderPanel();
});
panel.addEventListener('change',e=>{
  const ws=wstate(ST.wid),st=ws.style,look=ws.look[st],t=e.target;
  if(t.matches('[data-checks] input')){const k=t.closest('[data-checks]').dataset.checks,arr=ws.o[k];
    if(t.checked){if(!arr.includes(t.dataset.k))arr.push(t.dataset.k)}else ws.o[k]=arr.filter(x=>x!==t.dataset.k)}
  if(t.dataset.swOpt){ws.o[t.dataset.swOpt]=t.checked}
  if(t.dataset.pick){const id=t.dataset.pick;if(id==='t-col')ws.tcol=t.value;if(id==='l-fill'){look.fill=t.value;ws.tcol='auto'}if(id==='l-bc')look.bc=t.value}
  if(t.id==='o-upload'&&t.files&&t.files[0]){const r=new FileReader();r.onload=()=>{PHOTO=r.result;renderStage();renderMinis()};r.readAsDataURL(t.files[0]);return}
  save();renderStage();renderPanel();
});
panel.addEventListener('input',e=>{if(e.target.id==='l-w'){const ws=wstate(ST.wid);ws.w[ws.style]=+e.target.value;save();renderStage();const em=e.target.previousElementSibling.querySelector('em');if(em)em.textContent=e.target.value+' px'}});
document.fonts&&document.fonts.ready.then(()=>renderMinis());
renderAll();
})();
</script>
