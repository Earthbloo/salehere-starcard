<!doctype html>
<html lang="th"><head><meta charset="utf-8"><title>bug-sheet lab</title>
<style>body{margin:0;background:#e9e9ee;font:12px system-ui}.shot{position:relative;overflow:hidden;display:inline-block}</style></head>
<body><div id="out"></div><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script type="module">
// ?c=<encodeURIComponent(JSON)> : {kind,w,h,t,src:'work'|'head',item:{surface,border,kit},owner:{values,list,intake},photos:{}}
const S = 'http://localhost:8787/card/'
const { parseSpec } = await import(S + 'js/spec-model.js')
const { WebMeasurer, loadFonts } = await import(S + 'js/measure.js')
const { Profile } = await import(S + 'js/data.js')
const { mountWidget } = await import(S + 'js/chrome.js')
const { paintBackdrop } = await import(S + 'js/backdrop.js')
const { themeOf, defaultChoice } = await import(S + 'js/backdrop-tray.js')
await loadFonts(S + 'fonts/')
const c = JSON.parse(new URLSearchParams(location.search).get('c'))
const base = await fetch('http://localhost:8787/api/specs?' + Date.now()).then(r => r.json())
const raw = {}
for (const [k, v] of Object.entries(base.specs)) raw[k] = v
if (c.src && c.src !== 'work') raw[c.kind] = await fetch(`./${c.src}/${c.kind}.json?` + Date.now()).then(r => r.json())
const specs = {}
for (const [k, v] of Object.entries(raw)) { try { specs[k] = parseSpec(v) } catch (e) {} }
const THEMES = {
  dark: themeOf(defaultChoice()),
  navy: themeOf({ backdrop: 'gradient', primary: '#23284F', secondary: null, tone: 'dark' }),
  gold: themeOf({ backdrop: 'gradient', primary: '#6B5524', secondary: null, tone: 'dark' }),
  light: themeOf({ backdrop: 'solid', primary: '#AEB7F2', secondary: null, tone: 'dark' }),
}
const theme = THEMES[c.t || 'navy'], M = 14, W = c.w, H = c.h
const host = document.createElement('div'); host.className = 'shot'; host.id = 'shot'
host.style.width = (W + M * 2) + 'px'; host.style.height = (H + M * 2) + 'px'
document.getElementById('out').appendChild(host)
paintBackdrop(host, theme, W + M * 2, H + M * 2)
const item = { id: '00000000-0000-0000-0000-000000000001', kind: c.kind, x: M, y: M, w: W, h: H, surface: 'glass', border: false, ...(c.item || {}) }
const owner = c.owner || {}
const env = { doc: { photos: c.photos || {}, owner, notes: {} }, theme, profile: new Profile(owner, {}), specs, measurer: new WebMeasurer(), base: S, imageURL: id => `http://localhost:8787/api/images/${id}` }
try { mountWidget(host, item, { x: M, y: M, width: W, height: H }, env) } catch (e) { host.insertAdjacentHTML('beforeend', `<pre style="color:red;position:absolute;top:0">${e.stack}</pre>`); window.__err = String(e.stack) }
await new Promise(r => setTimeout(r, 500))
window.__ready = true
</script></body></html>
