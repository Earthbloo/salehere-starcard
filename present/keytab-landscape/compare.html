<!doctype html>
<html lang="th"><head><meta charset="utf-8"><title>scrapKeyTab ก่อน/หลัง</title>
<style>
  body { margin: 0; padding: 24px; background: #fff; font: 15px -apple-system, system-ui, sans-serif; color: #111; width: 1140px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p { margin: 0 0 18px; color: #666; }
  h2 { font-size: 17px; margin: 22px 0 10px; }
  table { border-collapse: collapse; }
  th { text-align: left; font-size: 14px; color: #555; padding: 0 12px 6px 0; font-weight: 600; }
  td { padding: 0 14px 12px 0; vertical-align: top; }
  td.lab { font-weight: 700; font-size: 15px; width: 70px; }
  .before { color: #c0392b; } .after { color: #1e8449; }
  img { display: block; height: var(--h); }
</style></head><body>
<h1>พวงกุญแจโซเชียล (scrapKeyTab) — ก่อนแก้ / หลังแก้</h1>
<p>วาดด้วยตัววาดเว็บจาก JSON จริง · ก่อน = git HEAD · หลัง = ไฟล์ปัจจุบัน</p>
<div id="o"></div>
<script>
const row = (lab, cls, v, size, t, h) => `<tr><td class="lab ${cls}">${lab}</td>${['3', '5'].map((n) => `<td><img style="--h:${h}px" src="shots/cmp-${v}-n${n}-${size}-${t}.png"></td>`).join('')}</tr>`
let html = ''
html += '<h2>แนวนอน (เต็มความกว้าง)</h2><table><tr><th></th><th>3 ช่องทาง</th><th>5 ช่องทาง</th></tr>'
html += row('ก่อน', 'before', 'old', '342x155', 'purple', 170) + row('หลัง', 'after', 'current', '342x155', 'purple', 170) + '</table>'
html += '<h2>แนวนอน (ครึ่งความกว้าง)</h2><table><tr><th></th><th>3 ช่องทาง</th><th>5 ช่องทาง</th></tr>'
html += row('ก่อน', 'before', 'old', '250x135', 'light', 150) + row('หลัง', 'after', 'current', '250x135', 'light', 150) + '</table>'
html += '<h2>แนวตั้ง</h2><table><tr><th></th><th>3 ช่องทาง</th><th>5 ช่องทาง</th><th></th><th>3 ช่องทาง</th><th>5 ช่องทาง</th></tr><tr>'
html += `<td class="lab before">ก่อน</td>${['3', '5'].map((n) => `<td><img style="--h:300px" src="shots/cmp-old-n${n}-109x307-purple.png"></td>`).join('')}`
html += `<td class="lab after">หลัง</td>${['3', '5'].map((n) => `<td><img style="--h:300px" src="shots/cmp-current-n${n}-109x307-purple.png"></td>`).join('')}</tr></table>`
document.getElementById('o').innerHTML = html
</script></body></html>
